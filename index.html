<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NelApp</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NelApp">
<style>
:root{
  --bg:#0f172a; --bg2:#0b1220; --card:#111c34; --line:#1e293b;
  --text:#e2e8f0; --muted:#94a3b8; --neon:#00ff88;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at top,#152040 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logobox{width:34px;height:34px;border-radius:10px;background:#0a0e1a;border:1px solid rgba(0,255,136,.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,255,136,.35)}
.brand .logobox img{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(0,255,136,.6))}
.brand h1{font-size:19px;letter-spacing:.2px}
.brand .ver{font-size:10px;color:var(--muted);display:block;margin-top:-2px}
.tabs{display:flex;background:var(--bg2);border-radius:99px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.active{background:#fff;color:#0f172a}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sbox .l{font-size:11px;color:var(--muted)}
.sbox .v{font-size:15px;font-weight:700;margin-top:2px}
.sbox.warn{border-color:#7f1d1d;background:#1a0f14}
.sbox.warn .v{color:#f87171}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:8px}
.section-head h2{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.btn{background:#1e293b;color:var(--text);border:1px solid #334155;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:#7c3aed;border-color:#7c3aed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tcard{position:relative;background:var(--card);border-radius:20px;border:2px solid var(--accent,#334155);padding:16px;overflow:hidden;box-shadow:0 0 18px color-mix(in srgb, var(--accent,#334155) 40%, transparent),inset 0 0 14px color-mix(in srgb, var(--accent,#334155) 12%, transparent)}
.tcard .glow{position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--accent,#334155);opacity:.3;filter:blur(30px)}
.tcard .head{display:flex;gap:10px;align-items:center;position:relative}
.badge-logo{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px;box-shadow:0 0 14px rgba(255,255,255,.25);position:relative;overflow:hidden}
.badge-logo img{width:100%;height:100%;object-fit:contain}
.badge-logo.txt{color:var(--accent,#334155);font-weight:800;font-size:15px}
.tname{font-weight:700;font-size:14px}
.tbank{font-size:11px;color:var(--muted)}
.pct-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.4px;color:#fff;margin-top:6px}
.bar{height:7px;border-radius:99px;background:#1e293b;margin-top:12px;overflow:hidden}
.bar > div{height:100%;border-radius:99px}
.trow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.trow b{color:var(--text);font-size:12px}
.tdates{margin-top:8px;font-size:10px;color:var(--muted);background:#0b1220;border-radius:8px;padding:6px 8px}
.tactions{display:flex;gap:6px;margin-top:12px;position:relative}
.tactions button{flex:1;font-size:11px;padding:6px}
.mv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mv .left b{font-size:13px}
.mv .left div{font-size:11px;color:var(--muted);margin-top:2px}
.mv .amt{font-weight:800;font-size:14px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:10px;padding:10px;font-size:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.lockscreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100;padding:20px;text-align:center}
.lockscreen h2{font-size:18px}
.pindots{display:flex;gap:12px}
.pindots span{width:14px;height:14px;border-radius:50%;border:1.5px solid #475569;background:transparent}
.pindots span.on{background:#7c3aed;border-color:#7c3aed}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}
.keypad button{width:64px;height:64px;border-radius:50%;background:#1e293b;border:1px solid #334155;color:#fff;font-size:20px}
.keypad button:active{background:#334155}
.err{color:#f87171;font-size:12px;min-height:16px}
.hint{color:var(--muted);font-size:12px}
.linkbtn{background:none;border:none;color:#7c3aed;font-size:12px;cursor:pointer;text-decoration:underline}
.hrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hrow .left div{font-size:11px;color:var(--muted);margin-top:2px}
.hrow .amt{font-weight:800;font-size:14px;color:#10b981;white-space:nowrap}
.holwrap{display:flex;flex-direction:column;gap:6px}
.holcard{background:var(--card);border:1px solid var(--line);border-left:3px solid #f59e0b;border-radius:10px;padding:9px 12px;font-size:12px;display:flex;justify-content:space-between}
.holcard .d{color:var(--muted);font-size:11px}
.neto{background:linear-gradient(135deg,#111c34,#0b1220);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}
.neto .l{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700}
.neto .v{font-size:30px;font-weight:800;margin-top:6px}
.neto .b{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.blurred{filter:blur(7px);user-select:none}
.eye{background:none;border:none;font-size:18px;cursor:pointer}
.minirow{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:12px}
.minirow .amt{font-weight:700}
.sabrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.sabrow input{width:70px;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:8px;padding:6px;font-size:13px;text-align:center}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
details.hcard{border:1px solid var(--accent,var(--line));border-left:4px solid var(--accent,var(--line));box-shadow:0 0 14px color-mix(in srgb, var(--accent,#334155) 25%, transparent)}
details[open]{padding-bottom:16px}
summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
.dcontent{margin-top:12px}
.progresswrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.progresswrap .rw{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.pbadge{background:#2563eb;color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px}
.pbar{height:10px;background:#0b1220;border:1px solid #1e293b;border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:#fff;border-radius:99px;transition:width .5s}
.pfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.pfoot b{color:var(--text)}
.cctnote{margin-top:8px;font-size:10px;color:#64748b}
.pinput{width:60px;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:8px;padding:5px;text-align:center;font-size:12px}
.recorow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:9px 10px;margin-bottom:7px;border:1px solid var(--line)}
.recologo{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.recologo img{width:100%;height:100%;object-fit:contain}
.recodot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.recobar{flex:1;height:5px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:4px}
.recobar>div{height:100%;border-radius:99px}
.infopanel{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:11px;line-height:1.6;color:#cbd5e1}
.infopanel b{color:#fff}
.icon-happy{display:inline-block;animation:bouncey 1s ease-in-out infinite}
.icon-alarm{display:inline-block;animation:pulsey .7s ease-in-out infinite}
@keyframes bouncey{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-6deg)}}
@keyframes pulsey{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ===== GLASS THEME (neón + traslúcido) ===== */
:root{--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.025);--gline:rgba(255,255,255,.11)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(520px 420px at 6% 4%,rgba(124,58,237,.30),transparent 62%),
 radial-gradient(440px 380px at 98% 28%,rgba(0,159,227,.20),transparent 62%),
 radial-gradient(500px 420px at 14% 88%,rgba(16,185,129,.15),transparent 62%),
 radial-gradient(420px 360px at 96% 96%,rgba(255,106,0,.15),transparent 62%)}
.wrap{padding-bottom:132px}
.sbox,.mv,.minirow,.hrow,.sabrow,.recorow,.holcard,.infopanel,.progresswrap,.neto,details,.daypanel,.hero,.tcard{
  background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--gline);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.09)}
.sbox,.progresswrap,.neto,.hero{border-radius:22px}
.sbox.warn{background:linear-gradient(160deg,rgba(239,68,68,.18),rgba(239,68,68,.05));border-color:rgba(239,68,68,.45)}
.tcard{border-radius:24px;border:1.5px solid color-mix(in srgb,var(--accent,#334155) 75%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--accent,#334155) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 26px color-mix(in srgb,var(--accent,#334155) 10%,transparent)}
details.hcard{border-radius:22px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-left:4px solid var(--accent);
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.09)}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.primary{background:linear-gradient(180deg,rgba(124,58,237,.95),rgba(124,58,237,.7));border-color:rgba(167,139,250,.6);box-shadow:0 0 14px rgba(124,58,237,.45)}
.modal{background:linear-gradient(160deg,rgba(28,38,66,.9),rgba(15,23,42,.88));border:1px solid var(--gline);border-radius:24px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1)}
.field input,.field select{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.overlay{background:rgba(2,6,23,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* dock inferior (barra traslúcida) */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,400px);height:60px;padding:5px;border-radius:99px;display:none;z-index:40;--ind:#7c3aed;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06)}
.dock.h{--ind:#10b981}
.dock-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:99px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ind) 55%,transparent),color-mix(in srgb,var(--ind) 22%,transparent));
  border:1px solid color-mix(in srgb,var(--ind) 80%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--ind) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .38s cubic-bezier(.4,1.35,.5,1),background .3s,border-color .3s,box-shadow .3s}
.dock.h .dock-ind{transform:translateX(100%)}
.dock button{flex:1;position:relative;z-index:1;background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:99px;transition:color .25s}
.dock button.on{color:#fff;text-shadow:0 0 10px color-mix(in srgb,var(--ind) 80%,transparent)}

/* hero + gráficos */
.hero{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden;
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.1)}
.hero::after{content:'';position:absolute;top:-50px;left:-30px;width:180px;height:140px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);pointer-events:none}
.herol{position:relative;z-index:1;text-align:center;flex-shrink:0}
.herot{font-size:9px;letter-spacing:1.1px;font-weight:800;color:var(--muted);margin-bottom:2px}
.heror{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--muted)}
.hstat:last-child{border-bottom:none;padding-bottom:0}
.hstat b{font-size:14px;color:var(--text)}
.tbody{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative}
.tstats{flex:1;min-width:0}
.ring,.gauge{display:block}
.crit svg,.crit.gaugewrap svg{animation:glowpulse 1.4s ease-in-out infinite alternate}
@keyframes glowpulse{from{filter:drop-shadow(0 0 2px rgba(239,68,68,.5))}to{filter:drop-shadow(0 0 11px rgba(239,68,68,.95))}}
.pct-badge{box-shadow:0 0 10px rgba(0,0,0,.25)}
.qbox{display:flex;align-items:center;gap:12px}
.qbox .qtxt{flex:1;min-width:0}
.progwrap{display:flex;align-items:center;gap:14px}

/* secciones Haberes */
summary{gap:10px}
.sico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  background:color-mix(in srgb,var(--accent,#94a3b8) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent,#94a3b8) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent,#94a3b8) 35%,transparent)}
.stitle{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px;font-weight:800;letter-spacing:.4px}
.stitle small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:1px}
.stotal{font-size:13px;font-weight:800;color:var(--accent,var(--text));white-space:nowrap}
.optcard{display:flex;align-items:center;gap:12px;width:100%}
.optbar{width:6px;align-self:stretch;min-height:44px;border-radius:6px;flex-shrink:0;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.optnum{font-size:26px;font-weight:800;line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums;
  color:var(--accent);text-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%,transparent)}
.opticon{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.opttext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.optlabel{font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--accent)}
.optsub{font-size:9px;color:var(--muted);letter-spacing:.2px}
.opttotal{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;flex-shrink:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{padding:8px 6px;border-radius:14px;text-align:center;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--accent,#fff) 32%,transparent)}
.chip span{display:block;font-size:9px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.chip b{font-size:13px;color:var(--accent,#fff)}

/* calendario glass */
.cal{position:relative;border-radius:24px;padding:14px 10px 10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 12px 30px rgba(0,0,0,.35)}
.cal::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:34%;height:3px;border-radius:0 0 8px 8px;background:var(--cc);box-shadow:0 0 14px var(--cc)}
.cal::after{content:'';position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:75%;height:100px;background:radial-gradient(closest-side,color-mix(in srgb,var(--cc) 34%,transparent),transparent);pointer-events:none}
.calhead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;margin-bottom:6px}
.calnav{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.calnav:active{background:color-mix(in srgb,var(--cc) 30%,transparent)}
.caltitle{font-weight:700;font-size:15px;letter-spacing:.2px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;position:relative;z-index:1}
.calwd{font-size:9px;font-weight:800;letter-spacing:.7px;color:#64748b;text-align:center;padding:7px 0 5px}
.calday{aspect-ratio:1;background:none;border:none;color:var(--text);font-size:13px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s,box-shadow .2s}
.calday.out{color:#475569;cursor:default}
.calday.today{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.calday.has{font-weight:800;background:color-mix(in srgb,var(--cc) 15%,transparent)}
.calday.has::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--cc);box-shadow:0 0 8px var(--cc)}
.calday.sel{background:var(--cc);color:var(--cct);box-shadow:0 0 18px var(--cc);transform:scale(1.04)}
.calday.sel::after{background:var(--cct);box-shadow:none}
.daypanel{margin-top:10px;border-radius:16px;padding:10px}

/* sábados · timeline infográfico */
.saginfo{position:relative;display:flex;gap:14px;overflow-x:auto;padding:30px 6px 34px;margin:0 -4px 4px;-webkit-overflow-scrolling:touch}
.saginfo::-webkit-scrollbar{display:none}
.saginfo::before{content:'';position:absolute;left:14px;right:14px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,#7c3aed,#ff6a00,#00AEEF,#facc15);opacity:.4;z-index:0}
.sagitem{position:relative;z-index:1;flex:0 0 92px;display:flex;justify-content:center;background:none;border:none;padding:0;cursor:pointer;font-family:inherit}
.sagpill{width:92px;height:150px;border-radius:46px;background:linear-gradient(165deg,var(--glass),var(--glass2));border:1px solid var(--gline);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;padding:0 4px}
.sagitem.top .sagpill{border-top:3px solid var(--sc)}
.sagitem.bot .sagpill{border-bottom:3px solid var(--sc)}
.sagbadge{position:absolute;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  background:linear-gradient(150deg,var(--sc),color-mix(in srgb,var(--sc) 45%,#0b1220));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 0 16px color-mix(in srgb,var(--sc) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.25)}
.sagitem.top .sagbadge{top:-22px}
.sagitem.bot .sagbadge{bottom:-22px}
.saglabel{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.saghours{font-size:18px;font-weight:800;color:#fff}
.sagsub{font-size:9px;color:var(--muted)}
.sagedit{font-size:13px;opacity:.55}
.sagtotal{text-align:center;font-size:11px;color:var(--muted);margin-top:-6px}

// ================= Firebase — Nell App Finance (proyecto propio y separado) =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection as fsCollection, doc as fsDoc, getDoc, getDocs, setDoc, updateDoc,
  deleteDoc, addDoc, writeBatch, onSnapshot, query, orderBy as fsOrderBy, limit as fsLimit
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

// PASO IMPORTANTE: reemplazá esto con la configuración que te da Firebase
// al crear la app web (Firebase Console → ⚙ Configuración del proyecto →
// Tus apps → ícono </> "Agregar app web" → copiá el objeto firebaseConfig).
const firebaseConfig = {
  apiKey: "REEMPLAZAR",
  authDomain: "REEMPLAZAR.firebaseapp.com",
  projectId: "REEMPLAZAR",
  storageBucket: "REEMPLAZAR.appspot.com",
  messagingSenderId: "REEMPLAZAR",
  appId: "REEMPLAZAR"
};
const fbApp = initializeApp(firebaseConfig);
const fsdb = getFirestore(fbApp);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

// ---- Shim: misma forma que el "db" original de Claude (collection/doc/get/set/update/delete/add/onSnapshot) ----
function wrapSnap(d){ return { id:d.id, exists:d.exists(), data:()=>d.data() }; }
function docRefShim(path){
  const ref = fsDoc(fsdb, path);
  return {
    get: async () => wrapSnap(await getDoc(ref)),
    set: (data) => setDoc(ref, data),
    update: (data) => updateDoc(ref, data),
    delete: () => deleteDoc(ref),
  };
}
function colRefShim(path){
  const cref = fsCollection(fsdb, path);
  const build = (constraints) => ({
    get: async () => {
      const snap = await getDocs(constraints.length? query(cref, ...constraints) : cref);
      return { docs: snap.docs.map(wrapSnap), empty: snap.empty, size: snap.size };
    },
    add: (data) => addDoc(cref, data),
    doc: (id) => docRefShim(`${path}/${id}`),
    orderBy: (f,dir) => build([...constraints, fsOrderBy(f, dir||'asc')]),
    limit: (n) => build([...constraints, fsLimit(n)]),
    onSnapshot: (cb) => onSnapshot(constraints.length? query(cref, ...constraints) : cref, (snap) => {
      cb({ docs: snap.docs.map(wrapSnap), empty: snap.empty, size: snap.size });
    }, (err) => console.error('onSnapshot error', path, err)),
  });
  return build([]);
}

// ---- Importador: pegás el JSON exportado de la app vieja y lo escribe acá ----
async function importarDatosJSON(jsonText){
  const data = JSON.parse(jsonText);
  const COLS = ['tarjetas','movimientos','horas','productos','joyeria','botas','retirados','adelantos','prestamos_di','prestamos_recibi','cobros'];
  for(const col of COLS){
    const items = data[col] || [];
    let batch = writeBatch(fsdb), n = 0;
    for(const item of items){
      const { id, ...rest } = item;
      const ref = fsDoc(fsdb, `${col}/${id}`);
      batch.set(ref, rest);
      n++;
      if(n % 400 === 0){ await batch.commit(); batch = writeBatch(fsdb); }
    }
    if(n % 400 !== 0) await batch.commit();
  }
  if(data.config_pay){ await setDoc(fsDoc(fsdb,'config/pay'), data.config_pay); }
}

function diasHastaCierre(cierre){
  if(!cierre) return null;
  const parts = cierre.split('/').map(Number);
  const d = parts[0], m = parts[1];
  if(!d||!m) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  let target = new Date(now.getFullYear(), m-1, d);
  if(target < now) target = new Date(now.getFullYear(), m, d);
  return Math.round((target-now)/86400000);
}
function parseFechaFull(fecha){
  const p = (fecha||'').split('/').map(Number);
  const d=p[0]||1, m=p[1]||1; let y=p[2];
  y = y? (y<100?2000+y:y) : 2026;
  return {d,m,y};
}
function cicloDeFecha(fechaObj, cierreDDMM){
  if(!cierreDDMM) return fechaObj.y*100+fechaObj.m;
  const cp = cierreDDMM.split('/').map(Number);
  const cd=cp[0], cm=cp[1];
  const purchase = new Date(fechaObj.y, fechaObj.m-1, fechaObj.d);
  const cierreEsteMes = new Date(fechaObj.y, fechaObj.m-1, cd);
  let cy=fechaObj.y, cm2=fechaObj.m;
  if(purchase > cierreEsteMes){ cm2+=1; if(cm2>12){cm2=1;cy+=1;} }
  return cy*100+cm2;
}
function addMonthsCiclo(cicloKey,n){
  let y=Math.floor(cicloKey/100), m=cicloKey%100;
  m+=n; while(m>12){m-=12;y+=1;}
  return y*100+m;
}
function cicloLabel(cicloKey){
  const y=Math.floor(cicloKey/100), m=cicloKey%100;

}
function nearestCicloParaHoy(cierreDDMM){
  const now=new Date();

}
function monthOptions(selectedKey){
  const now=new Date();
  const base = now.getFullYear()*100+(now.getMonth()+1);
  let opts='';
  let found=false;
  for(let i=-1;i<=13;i++){
    const k = addMonthsCiclo(base,i);
    if(k===selectedKey) found=true;
    opts += `<option value="${k}" ${k===selectedKey?'selected':''}>${cicloLabel(k)}</option>`;
  }
  if(!found && selectedKey) opts += `<option value="${selectedKey}" selected>${cicloLabel(selectedKey)}</option>`;
  return opts;
}

function cardInfo(t){

  const cd=cc[0]||1, cm=cc[1]||1, vd=vv[0]||cd, vm=vv[1]||cm;
  return {cd, vd, offset:(((vm-cm)%12)+12)%12};
}
function primerPagoAuto(m,t){ return addMonthsCiclo(cicloDeFecha(parseFechaFull(m.fecha), t&&t.cierre), cardInfo(t).offset); }
function movPrimerPago(m,t){
  if(m.primerPago!=null) return m.primerPago;

function cuotasDe(m,t){
  const n=m.cuotas||1, val=movValorCuota(m), first=movPrimerPago(m,t), vd=cardInfo(t).vd, out=[];
  for(let i=0;i<n;i++){
    const key=addMonthsCiclo(first,i);

}

function periodoLabel(){ const f=parseFechaFull(fechaCobro); let m=f.m-1, y=f.y; if(m<1){m=12;y--;} return MESES_FULL[m].toUpperCase()+' '+y; }
function sabadosDelMes(y,m){ const out=[]; const d=new Date(y,m-1,1); while(d.getMonth()===m-1){ if(d.getDay()===6) out.push({day:d.getDate(),label:'Sáb '+d.getDate(),hours:0}); d.setDate(d.getDate()+1);} return out; }
function diasHabilesMes(y,m){ let n=0; const d=new Date(y,m-1,1); while(d.getMonth()===m-1){ const w=d.getDay(); if(w>0&&w<6)n++; d.setDate(d.getDate()+1);} return n; }
function resumenTarjeta(t){
  const fin=periodoFin(); let futuras=0, terceroCiclo=0; const meses={};
  movimientos.filter(m=>m.tarjetaId===t.id).forEach(m=>{
    cuotasDe(m,t).forEach(cu=>{
      if(cu.fecha>=fin){ if(!m.tercero){ futuras+=cu.monto; meses[cu.key]=(meses[cu.key]||0)+cu.monto; } }
      else { if(m.tercero) terceroCiclo+=cu.monto; }
    });
  });
  futuras=Math.min(futuras,t.usado||0);
  const ap=Math.max((t.usado||0)-futuras-terceroCiclo,0);
  return {aPagar:ap<1?0:ap, futuras, meses};
}
function prestamoEnPeriodo(p){ const f=parseFechaFull(p.fechaPago); return new Date(f.y,f.m-1,f.d) < periodoFin(); }
function movCuotasLabel(m){
  const t=tarjetas.find(x=>x.id===m.tarjetaId); if(!t) return '';
  const cs=cuotasDe(m,t), fin=periodoFin();
  let txt='';
  if(!(cs.length<=1 && !cs.some(cu=>cu.fecha>=fin))){
    const f=cs[0];
    txt = cs.length>1 ? `${cs.length} cuotas de $${fmt(movValorCuota(m))} · 1ra: ${cicloLabel(f.key)} (vence ${fmtDate(f.fecha)})` : `Se paga en ${cicloLabel(f.key)} (vence ${fmtDate(f.fecha)})`;
  }
  return txt? `<div style="font-size:10px;color:#94a3b8">${txt}</div>` : '';
}
function tercerosResumen(){
  const map={};
  const get=n=>{ if(!map[n]) map[n]={pendiente:0,items:[]}; return map[n]; };
  movimientos.filter(m=>m.tercero).forEach(m=>{
    const g=get(m.tercero);
    g.items.push({tipo:'tarjeta',fecha:m.fecha,monto:m.monto,detalle:`${m.tarjeta}${m.tipo?' · '+m.tipo:''}${m.obs?' · '+m.obs:''}`,cobrado:!!m.terceroCobrado,id:m.id,col:'movimientos',field:'terceroCobrado'});
    if(!m.terceroCobrado) g.pendiente += (m.monto||0);
  });
  prestamosDi.filter(p=>p.aQuien).forEach(p=>{
    const g=get(p.aQuien);
    g.items.push({tipo:'efectivo',fecha:p.fecha,monto:p.monto,detalle:`Efectivo${p.obs?' · '+p.obs:''}`,cobrado:!!p.cobrado,id:p.id,col:'prestamos_di',field:'cobrado'});
    if(!p.cobrado) g.pendiente += (p.monto||0);
  });
  return map;
}

function parseFecha(f){
  if(!f) return 0;
  const parts = f.split('/').map(s=>parseInt(s));
  let d=parts[0]||0, m=parts[1]||0, y=parts[2];
  if(!y) y=2026; else if(y<100) y+=2000;
  return y*10000 + m*100 + d;
}

async function seedCollection(name, seedArr, withId){
  const snap = await db.collection(name).get();
  if(snap.empty && seedArr.length){
    for(const item of seedArr){
      if(withId){ const {id,...rest}=item; await db.collection(name).doc(id).set(rest); }
      else { await db.collection(name).add(item); }
    }
  }
}

async function migrateTarjetas(){
  for(const seed of SEED_TARJETAS){
    const ref = db.collection('tarjetas').doc(seed.id);
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data();
      const patch = {};
      if(!d.cierre) patch.cierre = seed.cierre;
      if(!d.vence) patch.vence = seed.vence;
      if(!d.logo) patch.logo = seed.logo;
      if(d.accent!==seed.accent) patch.accent = seed.accent;
      if(Object.keys(patch).length) await ref.update(patch);
    }
  }
}

function buildCalendar(items, colorHex, catId){
  const {y,m}=calMonthFor(catId), py=periodMonth().y;
  const byDay={};
  items.forEach(it=>{
    const p=(it.fecha||'').split('/').map(Number);
    const d=p[0], mo=p[1], yy=p[2]? (p[2]<100?2000+p[2]:p[2]) : py;
    if(!d||mo!==m||yy!==y) return;
    (byDay[d]=byDay[d]||[]).push(it);
  });
  const dim=new Date(y,m,0).getDate(), first=(new Date(y,m-1,1).getDay()+6)%7, prevDim=new Date(y,m-1,0).getDate();
  const now=new Date(), isNow=(now.getFullYear()===y && now.getMonth()+1===m);
  let cells=WD.map(w=>`<div class="calwd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells+=`<span class="calday out">${prevDim-first+1+i}</span>`;
  for(let d=1; d<=dim; d++){
    const has=byDay[d], sel=selectedDay[catId]===d, today=isNow&&now.getDate()===d;
    cells+=`<button type="button" class="calday ${has?'has':''} ${sel?'sel':''} ${today?'today':''}" onclick="toggleDay('${catId}',${d})">${d}</button>`;
  }
  const total=first+dim, rest=(7-(total%7))%7;
  for(let i=1;i<=rest;i++) cells+=`<span class="calday out">${i}</span>`;
  let panel='';
  const sel=selectedDay[catId];
  if(sel && byDay[sel]){
    panel=`<div class="daypanel">`+byDay[sel].map(it=>{
      const label = it.producto!==undefined && it.monto!==undefined ? `${it.producto} · ${money(it.monto)}` :
                    it.dec!==undefined ? `${it.dec} h · ${money(it.total)}` :
                    it.cliente!==undefined ? `${it.cliente||'Cliente'} · ${it.cant}u` : `${it.cant}u`;
      return `<div class="minirow" style="align-items:center"><span>${label}</span><button class="btn" style="padding:3px 7px" onclick='delItem("${catId}",${JSON.stringify(it.id)})'>✕</button></div>`;
    }).join('')+`</div>`;
  } else if(sel){
    panel=`<div class="daypanel"><div class="empty" style="padding:8px 0">Sin registros el ${sel} de ${MESES[m]}.</div></div>`;
  }
  return `<div class="cal" style="--cc:${colorHex};--cct:${onColor(colorHex)}">
    <div class="calhead"><button type="button" class="calnav" onclick="navCal('${catId}',-1)">‹</button><div class="caltitle">${MESES[m]} ${y}</div><button type="button" class="calnav" onclick="navCal('${catId}',1)">›</button></div>
    <div class="calgrid">${cells}</div></div>${panel}`;
}

function ringSVG(pct,color,size,stroke){
  const r=(size-stroke)/2, cc=2*Math.PI*r, p=Math.max(0,Math.min(100,pct)), h=size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="${stroke}"/>
    ${p>0?`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${cc*p/100} ${cc}" transform="rotate(-90 ${h} ${h})" style="filter:drop-shadow(0 0 5px ${color})"/>`:''}
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="${size*0.25}" font-weight="800">${Math.round(pct)}%</text></svg>`;
}
function gaugeSVG(pct,color,w){
  const stroke=14, r=w/2-stroke, cx=w/2, cy=w/2, len=Math.PI*r, p=Math.max(0,Math.min(100,pct));
  const d=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  return `<svg class="gauge" width="${w}" height="${cy+stroke/2+4}" viewBox="0 0 ${w} ${cy+stroke/2+4}">
    <path d="${d}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="${stroke}" stroke-linecap="round"/>
    ${p>0?`<path d="${d}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len*p/100} ${len}" style="filter:drop-shadow(0 0 6px ${color})"/>`:''}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#fff" font-size="${w*0.2}" font-weight="800">${Math.round(pct)}%</text></svg>`;
}

    <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px"><input type="checkbox" id="cb_pagar" checked style="margin-top:2px"> Ya pagué las tarjetas que vencían: bajar ese monto del "usado" de cada tarjeta</label>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="reiniciarPeriodo()">Confirmar</button></div>
  </div></div>`;

async function reiniciarPeriodo(){
  const L=lastCalc; if(!L) return;
  const pagar=document.getElementById('cb_pagar').checked;
  const strip=arr=>arr.map(({id,...r})=>r);
  const prDone=prestamosDi.filter(p=>p.cobrado), prPaid=prestamosRecibi.filter(p=>p.pagado||prestamoEnPeriodo(p));
  try{
    const snap={fechaCobro, cerradoEl:fmtDate(new Date()), neto:L.neto, tarjetasQueVencian:L.aPagarProximoVenc, tarjetasPagadas:pagar, quedo:L.neto-L.aPagarProximoVenc, base, rate,
      horas:strip(horas), productos:strip(productos), joyeria:strip(joyeria), botas:strip(botas), retirados:strip(retirados), adelantos:strip(adelantos), sabados,
      prestamosDi:strip(prDone), prestamosRecibi:strip(prPaid)};
    await db.collection('cobros').add(JSON.parse(JSON.stringify(snap)));
    const del=(col,arr)=>Promise.all(arr.map(x=>db.collection(col).doc(x.id).delete()));
    await del('horas',horas); await del('productos',productos); await del('joyeria',joyeria);
    await del('botas',botas); await del('retirados',retirados); await del('adelantos',adelantos);
    await del('prestamos_di',prDone); await del('prestamos_recibi',prPaid);
    if(pagar){ for(const r of L.resumenes){ if(r.aPagar>0) await db.collection('tarjetas').doc(r.t.id).update({usado:Math.max((r.t.usado||0)-r.aPagar,0)}); } }
    const f=parseFechaFull(fechaCobro);
    fechaCobro=fmtDate(new Date(f.y,f.m,f.d));
    sabados=sabadosDelMes(f.y,f.m); diasTrabajados=0; diasMes=diasHabilesMes(f.y,f.m);
    await db.doc('config/pay').update({fechaCobro,sabados,diasTrabajados,diasMes});
  }catch(e){ console.error(e); alert('Hubo un problema al registrar el cobro. Revisá y probá de nuevo.'); return; }
  closeModal(); render();
}

function openMovForm(id){

  const now = new Date();
  const today = m? m.fecha : now.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
  const nowTime = m? (m.hora||'').replace('h','') : now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const firstCard = tarjetas.find(x=>x.id===(m?m.tarjetaId:tarjetas[0]&&tarjetas[0].id));
  const defaultPago = m? movPrimerPago(m, firstCard) : (firstCard? primerPagoAuto({fecha:today}, firstCard) : cicloDeFecha(parseFechaFull(today),null));
  document.getElementById('modalRoot').innerHTML = `<div class="overlay"><div class="modal">
    <h3>${m?'Editar movimiento':'Nuevo movimiento'}</h3>
    <div class="field"><label>Tarjeta</label><select id="m_card" onchange="updateCuotaPreview()">${tarjetas.map(t=>`<option value="${t.id}" ${m&&m.tarjetaId===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
    <div class="field"><label>Fecha (DD/MM/AA)</label><input id="m_fecha" value="${today}" oninput="updateCuotaPreview()"></div>
    <div class="field"><label>Hora</label><input id="m_hora" value="${nowTime}"></div>
    <div class="field"><label>Monto total de la compra</label><input id="m_monto" type="text" inputmode="decimal" value="${m?m.monto:''}" placeholder="0" oninput="updateCuotaPreview()"></div>
    <div class="field"><label>Cuotas</label><select id="m_cuotas" onchange="updateCuotaPreview()">
      ${[1,2,3,6,9,12].map(n=>`<option value="${n}" ${m&&(m.cuotas||1)===n?'selected':''}>${n===1?'1 (contado)':n+' cuotas sin interés'}</option>`).join('')}
    </select></div>
    <div class="field"><label>Mes en que se paga la 1ra cuota</label><select id="m_ciclo" data-manual="${m?'1':''}" onchange="this.dataset.manual='1';updateCuotaPreview()">${monthOptions(defaultPago)}</select>
      <div class="hint" style="margin-top:4px">Se calcula solo con el cierre y vencimiento de la tarjeta. Cambialo si tu compra tiene promo con pago diferido.</div>
    </div>
    <div class="hint" id="m_cuota_preview" style="margin:6px 0 12px"></div>
    <div class="field"><label>Descripción</label><input id="m_tipo" value="${m?m.tipo||'':''}" placeholder="Ej: Supermercado"></div>
    <div class="field"><label>Categoría</label><select id="m_cat"><option value="">Sin categoría</option>${CATEGORIAS_GASTO.map(c=>`<option value="${c.v}" ${m&&m.categoria===c.v?'selected':''}>${c.v}</option>`).join('')}</select></div>
    <div class="field"><label>Observaciones</label><input id="m_obs" value="${m?m.obs||'':''}" placeholder="Para qué es"></div>
    <div class="field"><label>¿De quién es este gasto?</label>
      <select id="m_tercero_sel" onchange="document.getElementById('m_tercero_wrap').style.display=this.value==='otro'?'block':'none'">
        <option value="" ${!(m&&m.tercero)?'selected':''}>Mío · se resta de mi haber</option>
        <option value="otro" ${m&&m.tercero?'selected':''}>De otra persona · no se resta</option>
      </select>
    </div>
    <div class="field" id="m_tercero_wrap" style="display:${m&&m.tercero?'block':'none'}">
      <label>¿A quién le corresponde?</label>
      <input id="m_tercero" value="${m?m.tercero||'':''}" placeholder="Nombre">
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick='saveMov(${JSON.stringify(id||null)})'>Guardar</button></div>
  </div></div>`;
  updateCuotaPreview();
}
function updateCuotaPreview(){
  const elMonto=document.getElementById('m_monto'), elCuotas=document.getElementById('m_cuotas'), out=document.getElementById('m_cuota_preview');
  const elCard=document.getElementById('m_card'), elFecha=document.getElementById('m_fecha'), elPago=document.getElementById('m_ciclo');
  if(!elMonto||!out) return;
  const t=tarjetas.find(x=>x.id===elCard.value);
  const fecha=(elFecha.value||'').trim();
  if(t && fecha && elPago && !elPago.dataset.manual){
    const auto=primerPagoAuto({fecha},t);
    if(![...elPago.options].some(o=>+o.value===auto)) elPago.insertAdjacentHTML('beforeend',`<option value="${auto}">${cicloLabel(auto)}</option>`);
    elPago.value=auto;
  }
  const monto=toNum(elMonto.value), cuotas=parseInt(elCuotas.value)||1;
  const primer=elPago? parseInt(elPago.value):null;
  if(monto<=0 || !primer){ out.textContent=''; return; }
  const meses=[]; for(let i=0;i<cuotas;i++) meses.push(cicloLabel(addMonthsCiclo(primer,i)));
  let html = cuotas>1 ? `<b>${cuotas} cuotas de $${fmt(monto/cuotas)}</b><br>Se pagan en: ${meses.join(' · ')}` : `Un solo pago de <b>$${fmt(monto)}</b> en ${meses[0]}`;
  const pd=new Date(Math.floor(primer/100), primer%100-1, cardInfo(t).vd);
  html += pd>=periodoFin() ? `<br><span style="color:#10b981">✅ No se resta del cobro del ${fechaCobro}: queda en Saldo tarjeta futura.</span>` : `<br><span style="color:#f59e0b">⚠️ Vence antes del ${fmtDate(periodoFin())}: se resta del cobro del ${fechaCobro}.</span>`;
  out.innerHTML = html;
}
async function saveMov(id){
  const cardId = document.getElementById('m_card').value;
  const fecha = document.getElementById('m_fecha').value.trim();
  const horaVal = document.getElementById('m_hora').value.trim();
  const monto = toNum(document.getElementById('m_monto').value);
  const cuotas = parseInt(document.getElementById('m_cuotas').value)||1;
  const primerPago = parseInt(document.getElementById('m_ciclo').value);
  const valorCuota = Math.round((monto/cuotas)*100)/100;
  const tipo = document.getElementById('m_tipo').value.trim();
  const categoria = document.getElementById('m_cat').value;
  const obs = document.getElementById('m_obs').value.trim();
  const esTercero = document.getElementById('m_tercero_sel').value==='otro';
  const tercero = esTercero? document.getElementById('m_tercero').value.trim() : '';
  const t = tarjetas.find(x=>x.id===cardId);
  if(!t){ alert('Elegí una tarjeta.'); return; }
  if(monto<=0){ alert('El monto tiene que ser mayor a 0.'); return; }
  if(!fecha){ alert('Falta la fecha.'); return; }
  if(esTercero && !tercero){ alert('Escribí a quién le corresponde el gasto.'); return; }
  const prevForTercero = id? movimientos.find(x=>x.id===id) : null;
  const terceroCobrado = tercero? (prevForTercero && prevForTercero.tercero===tercero ? !!prevForTercero.terceroCobrado : false) : false;
  const hora = horaVal? horaVal+'h' : '';
  try{
    if(id){
      const prev = movimientos.find(x=>x.id===id);
      await db.collection('movimientos').doc(id).update({tarjetaId:cardId, tarjeta:t.name, monto, cuotas, valorCuota, primerPago, tipo, fecha, hora, categoria, obs, tercero, terceroCobrado});
      if(prev){
        const prevCard = tarjetas.find(x=>x.id===prev.tarjetaId);
        if(prevCard){
          await db.collection('tarjetas').doc(prevCard.id).update({usado: Math.max(prevCard.usado-prev.monto,0)});
        }
        const freshDoc = await db.doc(`tarjetas/${cardId}`).get();
        const baseUsado = freshDoc.exists? freshDoc.data().usado : t.usado;
        await db.collection('tarjetas').doc(cardId).update({usado: baseUsado+monto});
      }
    } else {
      await db.collection('movimientos').add({tarjetaId:cardId, tarjeta:t.name, monto, cuotas, valorCuota, primerPago, tipo, fecha, hora, categoria, obs, tercero, terceroCobrado});
      await db.collection('tarjetas').doc(cardId).update({usado: t.usado+monto});
    }
  }catch(e){ console.error(e); alert('No se pudo guardar el movimiento. Probá de nuevo.'); return; }
  closeModal();
}
async function delMov(id){
  const m = movimientos.find(x=>x.id===id);
  if(m){ const t=tarjetas.find(x=>x.id===m.tarjetaId); if(t) await db.collection('tarjetas').doc(t.id).update({usado:Math.max(t.usado-m.monto,0)}); }
  await db.collection('movimientos').doc(id).delete();
}

function openHorasForm(){
  const today = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  document.getElementById('modalRoot').innerHTML = `<div class="overlay"><div class="modal">
    <h3>Cargar horas extra</h3>
    <div class="field"><label>Fecha (DD/MM)</label><input id="h_fecha" value="${today}"></div>
    <div class="field"><label>Horas</label><input id="h_h" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label>Minutos</label><input id="h_m" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label class="hint">Tarifa actual: $${fmt(rate)}/hora</label></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveHoras()">Guardar</button></div>
  </div></div>`;
}
async function saveHoras(){
  const fecha = document.getElementById('h_fecha').value.trim();
  const hh = toNum(document.getElementById('h_h').value);
  const mm = toNum(document.getElementById('h_m').value);
  const dec = Math.round((hh + mm/60)*100)/100;
  if(!fecha){ alert('Falta la fecha.'); return; }
  if(dec<=0){ alert('Cargá horas o minutos mayores a 0.'); return; }
  const total = Math.round(dec*rate*100)/100;
  try{ await db.collection('horas').add({fecha, dec, total}); }
  catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); return; }
  closeModal();
}
