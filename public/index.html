<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NicSys Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#06100a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NicSys Finance">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f172a; --bg2:#0b1220; --card:#111c34; --line:#1e293b;
  --text:#e2e8f0; --muted:#94a3b8; --neon:#00ff88;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at top,#152040 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logobox{width:34px;height:34px;border-radius:10px;background:#0a0e1a;border:1px solid rgba(0,255,136,.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,255,136,.35)}
.brand .logobox img{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(0,255,136,.6))}
.brand h1{font-size:19px;letter-spacing:.2px}
.brand .ver{font-size:10px;color:var(--muted);display:block;margin-top:-2px}
.brand .master-gear{width:36px;height:36px;padding:0;font-size:18px;display:grid;place-items:center}
.app-footer{text-align:center;color:var(--muted);font-size:10px;letter-spacing:.2px;padding:18px 0 12px}
.master-modal{max-width:620px}
.master-card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.master-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.master-card-name{min-width:0}
.master-card-name b{display:block;overflow-wrap:anywhere}
.master-card-name small{color:var(--muted)}
.master-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.master-stat{background:rgba(0,0,0,.12);border-radius:10px;padding:9px;font-size:11px;color:var(--muted)}
.master-stat b{display:block;color:var(--text);font-size:13px;margin-top:2px}
.master-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.master-edit-grid .field{margin-bottom:3px}
.master-summary{margin-top:10px;padding:10px;border-radius:10px;background:rgba(124,58,237,.12);font-size:12px}
.home-explain{margin:10px 0 4px;padding:11px 12px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(15,23,42,.38);line-height:1.5}
.home-explain b{color:var(--text)}
.tabs{display:flex;background:var(--bg2);border-radius:99px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.active{background:#fff;color:#0f172a}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sbox .l{font-size:11px;color:var(--muted)}
.sbox .v{font-size:15px;font-weight:700;margin-top:2px}
.sbox.warn{border-color:#7f1d1d;background:#1a0f14}
.sbox.warn .v{color:#f87171}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:8px}
.section-head h2{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.btn{background:#1e293b;color:var(--text);border:1px solid #334155;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:#7c3aed;border-color:#7c3aed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tcard{position:relative;background:var(--card);border-radius:20px;border:2px solid var(--accent,#334155);padding:16px;overflow:hidden;box-shadow:0 0 18px color-mix(in srgb, var(--accent,#334155) 40%, transparent),inset 0 0 14px color-mix(in srgb, var(--accent,#334155) 12%, transparent)}
.tcard .glow{position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--accent,#334155);opacity:.3;filter:blur(30px)}
.tcard .head{display:flex;gap:10px;align-items:center;position:relative}
.badge-logo{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px;box-shadow:0 0 14px rgba(255,255,255,.25);position:relative;overflow:hidden}
.badge-logo img{width:100%;height:100%;object-fit:contain}
.badge-logo.txt{color:var(--accent,#334155);font-weight:800;font-size:15px}
.tname{font-weight:700;font-size:14px}
.tbank{font-size:11px;color:var(--muted)}
.pct-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.4px;color:#fff;margin-top:6px}
.bar{height:7px;border-radius:99px;background:#1e293b;margin-top:12px;overflow:hidden}
.bar > div{height:100%;border-radius:99px}
.trow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.trow b{color:var(--text);font-size:12px}
.tdates{margin-top:8px;font-size:10px;color:var(--muted);background:#0b1220;border-radius:8px;padding:6px 8px}
.tactions{display:flex;gap:6px;margin-top:12px;position:relative}
.tactions button{flex:1;font-size:11px;padding:6px}
.mv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mv .left b{font-size:13px}
.mv .left div{font-size:11px;color:var(--muted);margin-top:2px}
.mv .amt{font-weight:800;font-size:14px;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:10px;padding:10px;font-size:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.lockscreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100;padding:20px;text-align:center}
.lockscreen h2{font-size:18px}
.pindots{display:flex;gap:12px}
.pindots span{width:14px;height:14px;border-radius:50%;border:1.5px solid #475569;background:transparent}
.pindots span.on{background:#7c3aed;border-color:#7c3aed}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}
.keypad button{width:64px;height:64px;border-radius:50%;background:#1e293b;border:1px solid #334155;color:#fff;font-size:20px}
.keypad button:active{background:#334155}
.err{color:#f87171;font-size:12px;min-height:16px}
.hint{color:var(--muted);font-size:12px}
.linkbtn{background:none;border:none;color:#7c3aed;font-size:12px;cursor:pointer;text-decoration:underline}
.hrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hrow .left div{font-size:11px;color:var(--muted);margin-top:2px}
.hrow .amt{font-weight:800;font-size:14px;color:#10b981;white-space:nowrap}
.holwrap{display:flex;flex-direction:column;gap:6px}
.holcard{background:var(--card);border:1px solid var(--line);border-left:3px solid #f59e0b;border-radius:10px;padding:9px 12px;font-size:12px;display:flex;justify-content:space-between}
.holcard .d{color:var(--muted);font-size:11px}
.neto{background:linear-gradient(135deg,#111c34,#0b1220);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}
.neto .l{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700}
.neto .v{font-size:30px;font-weight:800;margin-top:6px}
.neto .b{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.blurred{filter:blur(7px);user-select:none}
.eye{background:none;border:none;font-size:18px;cursor:pointer}
.minirow{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:12px}
.minirow .amt{font-weight:700}
.sabrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.sabrow input{width:70px;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:8px;padding:6px;font-size:13px;text-align:center}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
details.hcard{border:1px solid var(--accent,var(--line));border-left:4px solid var(--accent,var(--line));box-shadow:0 0 14px color-mix(in srgb, var(--accent,#334155) 25%, transparent)}
details[open]{padding-bottom:16px}
summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .2s}
details[open] summary .chev{transform:rotate(90deg)}
.dcontent{margin-top:12px}
.progresswrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.progresswrap .rw{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.pbadge{background:#2563eb;color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px}
.pbar{height:10px;background:#0b1220;border:1px solid #1e293b;border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:#fff;border-radius:99px;transition:width .5s}
.pfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.pfoot b{color:var(--text)}
.cctnote{margin-top:8px;font-size:10px;color:#64748b}
.pinput{width:60px;background:#0b1220;border:1px solid #334155;color:var(--text);border-radius:8px;padding:5px;text-align:center;font-size:12px}
.recorow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:9px 10px;margin-bottom:7px;border:1px solid var(--line)}
.recologo{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.recologo img{width:100%;height:100%;object-fit:contain}
.recodot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.recobar{flex:1;height:5px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:4px}
.recobar>div{height:100%;border-radius:99px}
.infopanel{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:11px;line-height:1.6;color:#cbd5e1}
.infopanel b{color:#fff}
.icon-happy{display:inline-block;animation:bouncey 1s ease-in-out infinite}
.icon-alarm{display:inline-block;animation:pulsey .7s ease-in-out infinite}
@keyframes bouncey{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-6deg)}}
@keyframes pulsey{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ===== GLASS THEME (neón + traslúcido) ===== */
:root{--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.025);--gline:rgba(255,255,255,.11)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(560px 460px at 6% 4%,rgba(124,58,237,.38),transparent 62%),
 radial-gradient(480px 420px at 98% 28%,rgba(0,159,227,.26),transparent 62%),
 radial-gradient(540px 460px at 14% 88%,rgba(16,185,129,.2),transparent 62%),
 radial-gradient(460px 400px at 96% 96%,rgba(255,106,0,.2),transparent 62%),
 radial-gradient(900px 700px at 50% 45%,rgba(255,255,255,.035),transparent 70%)}
.wrap{padding-bottom:132px}
.sbox,.mv,.minirow,.hrow,.sabrow,.recorow,.holcard,.infopanel,.progresswrap,.neto,details,.daypanel,.hero,.tcard{
  background:
    linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.06) 32%,rgba(255,255,255,0) 58%),
    linear-gradient(160deg,var(--glass),var(--glass2));
  border:1px solid var(--gline);
  -webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);
  box-shadow:0 10px 28px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -8px 14px -8px rgba(0,0,0,.28)}
.sbox,.progresswrap,.neto,.hero{border-radius:22px}
.sbox.warn{background:linear-gradient(160deg,rgba(239,68,68,.18),rgba(239,68,68,.05));border-color:rgba(239,68,68,.45)}
.tcard{border-radius:24px;border:1.5px solid color-mix(in srgb,var(--accent,#334155) 75%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--accent,#334155) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 26px color-mix(in srgb,var(--accent,#334155) 10%,transparent)}
details.hcard{border-radius:22px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-left:4px solid var(--accent);
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.09)}

/* ===== Carrusel de tarjetas estilo fintech ===== */
.cardscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 32px 10px;margin:0 -16px;-webkit-overflow-scrolling:touch}
.cardscroll::-webkit-scrollbar{display:none}
.ccard{scroll-snap-align:center;flex:0 0 82%;max-width:320px;border-radius:26px;padding:18px;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(150deg, color-mix(in srgb,var(--accent) 50%,#0b1220) 0%, color-mix(in srgb,var(--accent) 18%,#0b1220) 55%, #0b1220 100%);
  border:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);
  box-shadow:0 18px 40px rgba(0,0,0,.42),0 0 30px color-mix(in srgb,var(--accent) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -12px 22px -14px rgba(0,0,0,.45)}
.ccglow{position:absolute;top:-55%;left:-25%;width:150%;height:100%;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent 70%);transform:rotate(-10deg);pointer-events:none}
.cctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:1}
.ccbrand{display:flex;align-items:center;gap:10px;min-width:0}
.ccname{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.cctype{font-size:10px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ccbal{margin-top:18px;position:relative;z-index:1}
.ccbal-v{font-size:26px;font-weight:800;letter-spacing:.3px;margin-top:2px}
.ccfoot{display:flex;justify-content:space-between;gap:6px;margin-top:12px;position:relative;z-index:1}
.ccfoot div{display:flex;flex-direction:column;gap:2px;font-size:12px}
.ccfoot .hint{font-size:9px}
.ccard .tactions{position:relative;z-index:1;margin-top:10px}
.carddots{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.carddot{width:6px;height:6px;border-radius:99px;border:none;background:rgba(255,255,255,.22);padding:0;cursor:pointer;transition:all .2s}
.carddot.on{width:20px;background:var(--accent,#fff)}
.btn{position:relative;overflow:hidden;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 55%,rgba(255,255,255,.02)),rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -4px 8px -4px rgba(0,0,0,.3);
  transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,rgba(167,139,250,.55),rgba(124,58,237,.15) 55%,rgba(124,58,237,.75)),linear-gradient(180deg,rgba(124,58,237,.95),rgba(124,58,237,.7));
  border-color:rgba(196,181,253,.7);box-shadow:0 0 18px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -4px 8px -4px rgba(0,0,0,.35)}
.modal{position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 40%),linear-gradient(160deg,rgba(28,38,66,.92),rgba(15,23,42,.9));
  border:1px solid var(--gline);border-radius:26px;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -10px 20px -14px rgba(0,0,0,.4)}
.field input,.field select{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.overlay{background:rgba(2,6,23,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* dock inferior (barra traslúcida) */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,400px);height:60px;padding:5px;border-radius:99px;display:none;z-index:40;--ind:#7c3aed;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.03) 50%,rgba(255,255,255,.08));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.2);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 12px -8px rgba(0,0,0,.3)}
.dock.f{--ind:#7c3aed}
.dock.h{--ind:#10b981}
.dock.i{--ind:#00AEEF}
.dock-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(33.333% - 3.4px);border-radius:99px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ind) 55%,transparent),color-mix(in srgb,var(--ind) 22%,transparent));
  border:1px solid color-mix(in srgb,var(--ind) 80%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--ind) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .38s cubic-bezier(.4,1.35,.5,1),background .3s,border-color .3s,box-shadow .3s}
.dock.i .dock-ind{transform:translateX(0%)}
.dock.f .dock-ind{transform:translateX(100%)}
.dock.h .dock-ind{transform:translateX(200%)}
.dock button{flex:1;position:relative;z-index:1;background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:99px;transition:color .25s}
.dock button.on{color:#fff;text-shadow:0 0 10px color-mix(in srgb,var(--ind) 80%,transparent)}
.bell{position:relative;width:40px;height:40px;padding:0;display:grid;place-items:center}
.bell-ic{width:19px;height:19px;display:grid;place-items:center;color:#c5d2da;transition:color .2s,transform .2s}
.bell-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bell:hover .bell-ic{color:#63d6e2;transform:translateY(-1px)}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#26c6da;color:#10232a;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(38,198,218,.25);border:1px solid rgba(12,17,24,.8);animation:none}
.alertrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px}
.alertrow.rojo{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3)}
.alertrow.amarillo{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3)}
.alertrow .ai{font-size:17px;flex-shrink:0}
.homegreet{margin-bottom:14px}
.homecard{position:relative;border-radius:22px;padding:18px;margin-bottom:16px;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 35%,#0b1220),#0b1220 70%);
  border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:0 0 26px color-mix(in srgb,var(--accent) 25%,transparent),inset 0 1px 0 rgba(255,255,255,.15)}
.homecard-v{font-size:30px;font-weight:800;margin-top:4px}
.homeactions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.homerow{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border-radius:17px;margin-bottom:9px;width:100%;box-sizing:border-box;
  background:linear-gradient(145deg,rgba(34,48,69,.96),rgba(26,39,58,.97));border:1px solid rgba(155,176,207,.15);border-left:4px solid var(--rc,#94a3b8);box-shadow:0 5px 17px rgba(4,10,22,.15)}
.homerow-ic{font-size:18px;line-height:1.2;flex-shrink:0;width:24px;text-align:center}
.homerow-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.homerow-main b{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.homerow-sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.homerow-date{font-size:10px;color:var(--muted);opacity:.75;display:block}
.homerow-amt{flex:0 0 auto;font-size:13px;font-weight:800;white-space:nowrap;margin-left:6px;text-align:right}
.homeaction{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--text);font-size:10px;cursor:pointer}
.ha-ic{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 55%),color-mix(in srgb,var(--ac) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 12px color-mix(in srgb,var(--ac) 25%,transparent)}

/* hero + gráficos */
.hero{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden;
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.1)}
.hero::after{content:'';position:absolute;top:-50px;left:-30px;width:180px;height:140px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);pointer-events:none}
.herol{position:relative;z-index:1;text-align:center;flex-shrink:0}
.herot{font-size:9px;letter-spacing:1.1px;font-weight:800;color:var(--muted);margin-bottom:2px}
.heror{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hstat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--muted)}
.hstat:last-child{border-bottom:none;padding-bottom:0}
.hstat b{font-size:14px;color:var(--text)}
.tbody{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative}
.tstats{flex:1;min-width:0}
.ring,.gauge{display:block}
.crit svg,.crit.gaugewrap svg{animation:glowpulse 1.4s ease-in-out infinite alternate}
@keyframes glowpulse{from{filter:drop-shadow(0 0 2px rgba(239,68,68,.5))}to{filter:drop-shadow(0 0 11px rgba(239,68,68,.95))}}
@keyframes spinring{to{transform:rotate(360deg)}}
.spinner-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(124,58,237,.2);border-top-color:#7c3aed;box-shadow:0 0 16px rgba(124,58,237,.4);animation:spinring .8s linear infinite}
.pct-badge{box-shadow:0 0 10px rgba(0,0,0,.25)}
.qbox{display:flex;align-items:center;gap:12px}
.qbox .qtxt{flex:1;min-width:0}
.progwrap{display:flex;align-items:center;gap:14px}

/* secciones Haberes */
summary{gap:10px}
.sico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 50%),color-mix(in srgb,var(--accent,#94a3b8) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--accent,#94a3b8) 60%,transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--accent,#94a3b8) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 6px -3px rgba(0,0,0,.3)}
.stitle{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px;font-weight:800;letter-spacing:.4px}
.stitle small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:1px}
.stotal{font-size:13px;font-weight:800;color:var(--accent,var(--text));white-space:nowrap}
.optcard{display:flex;align-items:center;gap:12px;width:100%}
.optbar{width:6px;align-self:stretch;min-height:44px;border-radius:6px;flex-shrink:0;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.optnum{font-size:26px;font-weight:800;line-height:1;flex-shrink:0;font-variant-numeric:tabular-nums;
  color:var(--accent);text-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%,transparent)}
.opticon{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.32),transparent 55%),color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 6px -3px rgba(0,0,0,.3)}
.opttext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.optlabel{font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--accent)}
.optsub{font-size:9px;color:var(--muted);letter-spacing:.2px}
.opttotal{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;flex-shrink:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{padding:8px 6px;border-radius:14px;text-align:center;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--accent,#fff) 32%,transparent)}
.chip span{display:block;font-size:9px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.chip b{font-size:13px;color:var(--accent,#fff)}

/* calendario glass */
.cal{position:relative;border-radius:24px;padding:14px 10px 10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.02) 45%,rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -8px 16px -10px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.38)}
.cal::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:34%;height:3px;border-radius:0 0 8px 8px;background:var(--cc);box-shadow:0 0 14px var(--cc)}
.cal::after{content:'';position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:75%;height:100px;background:radial-gradient(closest-side,color-mix(in srgb,var(--cc) 34%,transparent),transparent);pointer-events:none}
.calhead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;margin-bottom:6px}
.calnav{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.02) 55%);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:17px;line-height:1;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 8px rgba(0,0,0,.25)}
.calnav:active{background:color-mix(in srgb,var(--cc) 30%,transparent)}
.caltitle{font-weight:700;font-size:15px;letter-spacing:.2px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;position:relative;z-index:1}
.calwd{font-size:9px;font-weight:800;letter-spacing:.7px;color:#64748b;text-align:center;padding:7px 0 5px}
.calday{aspect-ratio:1;background:none;border:none;color:var(--text);font-size:13px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s,box-shadow .2s}
.calday.out{color:#475569;cursor:default}
.calday.today{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.calday.has{font-weight:800;background:color-mix(in srgb,var(--cc) 15%,transparent)}
.calday.has::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--cc);box-shadow:0 0 8px var(--cc)}
.calday.sel{background:var(--cc);color:var(--cct);box-shadow:0 0 18px var(--cc);transform:scale(1.04)}
.calday.sel::after{background:var(--cct);box-shadow:none}
.daypanel{margin-top:10px;border-radius:16px;padding:10px}

/* ===== Tarjeta premium con switch (Botas/Joyería/Retirados/Productos) ===== */
.premcard{display:block;position:relative;border-radius:20px;overflow:hidden;padding:0;cursor:pointer;
  background:linear-gradient(160deg,#111a2e,#0a0f1c);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.premswoosh{position:absolute;inset:0;height:92px;background:
  linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--pc) 85%,#000) 45%,var(--pc) 60%,color-mix(in srgb,var(--pc) 70%,#fff) 68%,var(--pc) 78%,transparent 95%);
  opacity:.95}
.premswoosh::after{content:'';position:absolute;inset:0;background:radial-gradient(120px 60px at 18% 15%,rgba(255,255,255,.35),transparent 70%)}
.premtop{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 10px;height:68px}
.premleft{display:flex;align-items:center;gap:9px;min-width:0}
.premicon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.premleft b{font-size:13px;color:#fff;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.premleft .hint{color:rgba(255,255,255,.85);font-size:9px}
.premtotal{text-align:right;flex-shrink:0}
.premtotal-v{font-size:19px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap}
.premtotal-l{font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.8)}
.prembottom{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 14px}
.tgl{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:2px;flex-shrink:0;transition:background .25s}
.tgl-dot{width:16px;height:16px;border-radius:50%;background:#64748b;transition:transform .25s,background .25s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
details[open] .tgl{background:color-mix(in srgb,var(--pc) 55%,transparent)}
details[open] .tgl-dot{transform:translateX(18px);background:var(--pc);box-shadow:0 0 8px var(--pc)}

/* ===== Vista semanal (Joyería / Botas / Retirados / Productos) ===== */
.weekcard{position:relative;border-radius:22px;padding:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,.04));
  border:1px solid color-mix(in srgb,var(--wc) 45%,rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -8px 16px -10px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.35),0 0 20px color-mix(in srgb,var(--wc) 20%,transparent)}
.weekhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.weektitle{display:flex;align-items:center;gap:9px}
.wicon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 55%),color-mix(in srgb,var(--wc) 22%,transparent);
  border:1px solid color-mix(in srgb,var(--wc) 55%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.weektitle b{font-size:12px;letter-spacing:.3px}
.weeknav{display:flex;align-items:center;gap:4px}
.weekdays{flex:1;display:flex;justify-content:space-between;gap:3px}
.weekday{flex:1;background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;cursor:pointer;position:relative}
.wd-l{font-size:9px;color:var(--muted);font-weight:700}
.wd-n{font-size:14px;font-weight:700;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.weekday.today .wd-n{border:1.5px solid var(--wc)}
.weekday.sel .wd-n{background:var(--wc);color:#0b1220;box-shadow:0 0 12px var(--wc)}
.wd-dot{width:4px;height:4px;border-radius:50%;background:var(--wc);box-shadow:0 0 6px var(--wc)}

/* sábados · timeline infográfico */
.saginfo{position:relative;display:flex;gap:14px;overflow-x:auto;padding:30px 6px 34px;margin:0 -4px 4px;-webkit-overflow-scrolling:touch}
.saginfo::-webkit-scrollbar{display:none}
.saginfo::before{content:'';position:absolute;left:14px;right:14px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,#7c3aed,#ff6a00,#00AEEF,#facc15);opacity:.4;z-index:0}
.sagitem{position:relative;z-index:1;flex:0 0 92px;display:flex;justify-content:center;background:none;border:none;padding:0;cursor:pointer;font-family:inherit}
.sagpill{width:92px;height:150px;border-radius:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.04) 35%,transparent 60%),linear-gradient(165deg,var(--glass),var(--glass2));
  border:1px solid var(--gline);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -8px 14px -10px rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;padding:0 4px}
.sagitem.top .sagpill{border-top:3px solid var(--sc)}
.sagitem.bot .sagpill{border-bottom:3px solid var(--sc)}
.sagbadge{position:absolute;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  background:linear-gradient(150deg,var(--sc),color-mix(in srgb,var(--sc) 45%,#0b1220));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 0 16px color-mix(in srgb,var(--sc) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -4px 8px -4px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.3)}
.sagitem.top .sagbadge{top:-22px}
.sagitem.bot .sagbadge{bottom:-22px}
.saglabel{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.saghours{font-size:18px;font-weight:800;color:#fff}
.sagsub{font-size:9px;color:var(--muted)}
.sagedit{font-size:13px;opacity:.55}
.sagtotal{text-align:center;font-size:11px;color:var(--muted);margin-top:-6px}
.qgroup{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.qghead{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.qgroup-pos .minirow .amt{color:#10b981}
.qgroup-neg .minirow .amt{color:#f87171}
.qgtotal{border-top:1px dashed rgba(255,255,255,.15);margin-top:4px;padding-top:6px;font-weight:800}
.qgroup-final{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 10px 4px;border-top:none;margin-top:14px}
.qgroup-final .minirow .amt{color:#fff}

/* ===== Refresh fintech claro · datos y flujos intactos ===== */
:root{
  --bg:#f4f6fb;--bg2:#edf0f7;--card:#fff;--line:#e6eaf2;
  --text:#172033;--muted:#778197;--neon:#23c98b;
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.34);--gline:rgba(255,255,255,.78);
  color-scheme:light;
}
body{
  background:
    radial-gradient(ellipse at 8% 0%,rgba(105,92,240,.09),transparent 36%),
    radial-gradient(ellipse at 96% 24%,rgba(31,193,172,.08),transparent 34%),
    linear-gradient(180deg,#f8f9fc 0%,#f2f4f9 100%);
  color:var(--text)
}
body::before{
  background:
    radial-gradient(520px 380px at 2% 8%,rgba(126,105,255,.075),transparent 68%),
    radial-gradient(480px 380px at 100% 26%,rgba(0,174,160,.055),transparent 68%),
    radial-gradient(620px 520px at 20% 100%,rgba(61,166,255,.045),transparent 70%)
}
.wrap{max-width:760px;padding:18px 16px calc(126px + env(safe-area-inset-bottom,0px))}
.brand .logobox{background:#fff;border-color:#e7e8ff;box-shadow:0 5px 16px rgba(75,67,170,.12)}
.brand .logobox img{filter:none}
.brand h1{color:#20283a}
.brand .ver{color:#8992a5}
.sbox,.mv,.minirow,.hrow,.sabrow,.recorow,.holcard,.infopanel,.progresswrap,.neto,details,.daypanel,.hero,.tcard{
  background:#fff;border:1px solid #e8ebf2;-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 7px 22px rgba(37,47,73,.055),inset 0 1px 0 rgba(255,255,255,.9)
}
.sbox,.progresswrap,.neto,.hero{border-radius:22px}
.sbox .l,.hint,.trow,.pfoot,.qghead{color:#778197}
.sbox .v,.hstat b,.stotal,.opttotal{color:#20283a}
.sbox.warn{background:linear-gradient(145deg,#fff,#fff4f3);border-color:#f5d4d2}
.sbox.warn .v{color:#d94949}
.section-head h2{color:#768096}
.btn{
  color:#313a50;background:linear-gradient(180deg,#fff,#f8f9fc);border-color:#e3e7ef;
  -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 3px 9px rgba(36,47,73,.07),inset 0 1px 0 #fff
}
.btn.primary{
  color:#fff;background:linear-gradient(135deg,#695cf0,#8270ff);border-color:#7569ef;
  box-shadow:0 6px 16px rgba(105,92,240,.22),inset 0 1px 0 rgba(255,255,255,.35)
}
.linkbtn{color:#6659df}
.tabs{background:#e9ecf4}
.tabs button.active{background:#fff;color:#252d42;box-shadow:0 2px 8px rgba(39,49,74,.1)}
.neto{
  background:linear-gradient(140deg,#fff 0%,#f5f3ff 58%,#effbfa 100%);
  border-color:#e5e4f4;box-shadow:0 12px 30px rgba(52,55,98,.08)
}
.neto .v{color:#252c42}
.hero{background:linear-gradient(135deg,#fff,#f8faff);border-color:#e4e8f1;box-shadow:0 9px 24px rgba(38,48,72,.06)}
.hero::after{opacity:.32}
.hstat{border-color:#edf0f5}
.hstat b{color:#273148}
details{background:#fff;border-color:#e7eaf1}
details.hcard{
  border:1px solid #e6eaf1;border-left:4px solid var(--accent,#d6dbea);
  box-shadow:0 7px 21px rgba(39,49,75,.045),inset 0 1px 0 #fff
}
details[open]{border-color:color-mix(in srgb,var(--accent,#d6dbea) 34%,#e7eaf1)}
summary .chev{color:#929aab}
.sico,.opticon{
  background:color-mix(in srgb,var(--accent,#8290a8) 11%,#fff);
  border-color:color-mix(in srgb,var(--accent,#8290a8) 26%,#fff);
  box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(35,45,70,.045)
}
.optlabel{color:var(--accent)}
.opttotal{color:#263047}
.qgroup{border-color:#e8ebf1}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection as fsCollection, doc as fsDoc, getDoc, getDocs, setDoc, updateDoc,
  deleteDoc, addDoc, writeBatch, onSnapshot, query, orderBy as fsOrderBy, limit as fsLimit
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check.js";
import { getAI, getGenerativeModel, GoogleAIBackend, Schema } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";

// PASO IMPORTANTE: reemplazá esto con la configuración que te da Firebase
// al crear la app web (Firebase Console -> Configuracion del proyecto -> Tus apps -> SDK setup).
const firebaseConfig = {
  apiKey: "AIzaSyBCJXao3wJcnFof1mC6C57ST2qrm0g1TwQ",
  authDomain: "nell-app-finance.firebaseapp.com",
  projectId: "nell-app-finance",
  storageBucket: "nell-app-finance.firebasestorage.app",
  messagingSenderId: "958662687016",
  appId: "1:958662687016:web:2e7f8f8b8a3a9c3284f81d"
};
const fbApp = initializeApp(firebaseConfig);
const appCheck = initializeAppCheck(fbApp, {
  provider: new ReCaptchaEnterpriseProvider("6Lftcx0uAAAAAGzupLNPw8uUtUyvcWTeIAxsJpDa"),
  isTokenAutoRefreshEnabled: true
});
const fsdb = getFirestore(fbApp);
const auth = getAuth(fbApp);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

const financeTools = [{ functionDeclarations: [
  { name:"consultar_finanzas", description:"Consulta los datos cargados en un módulo financiero. Siempre es de solo lectura.", parameters:Schema.object({
    properties:{modulo:Schema.string({enum:["general","billetera","prestamos","tarjetas","compras_tarjeta","transferencias","deudas","haberes","historial","configuracion","estadisticas"]}),periodo:Schema.string({description:"Período solicitado en lenguaje natural; por ejemplo este mes, octubre o últimos movimientos."}),filtro:Schema.string({description:"Cuenta, persona, tarjeta, categoría o concepto opcional."})}, optionalProperties:["periodo","filtro"]
  })},
  { name:"preparar_operacion", description:"Prepara una operación compatible en NicSys y la deja pendiente de confirmación explícita. Nunca guarda ni modifica datos.", parameters:Schema.object({
    properties:{tipo:Schema.string({enum:["gasto","ingreso","pago_tarjeta","compra_tarjeta"]}),monto:Schema.number({description:"Importe positivo expresado por el usuario."}),descripcion:Schema.string({description:"Concepto exacto, comercio o detalle expresado por el usuario."}),fecha:Schema.string({description:"Fecha YYYY-MM-DD; usar la fecha actual si el usuario no dijo otra."}),medio:Schema.string({enum:["efectivo","digital","debito","transferencia","credito"]}),cuenta:Schema.string({description:"Nombre exacto de la cuenta si fue expresado."}),categoria:Schema.string({description:"Categoría existente si fue expresada o reconocible con certeza."}),tarjeta:Schema.string({description:"Nombre exacto de tarjeta si fue expresado."}),cuotas:Schema.integer({description:"Cuotas indicadas por el usuario; solo 1, 2, 3, 6, 9 o 12."})}, optionalProperties:["descripcion","fecha","medio","cuenta","categoria","tarjeta","cuotas"]
  })}
]}];
const financeAI=getAI(fbApp,{backend:new GoogleAIBackend()});
const financeModel=getGenerativeModel(financeAI,{model:"gemini-3.8-flash",tools:financeTools,systemInstruction:"Sos NicSys IA, asistente financiero de esta aplicación, en español argentino y con respuestas breves. Solo usá datos entregados por las herramientas; nunca inventes saldos, personas, fechas ni resultados. Para una consulta financiera invocá consultar_finanzas con el módulo pertinente. Para registrar algo, invocá preparar_operacion solo si hay intención clara y los datos principales están dichos. Nunca afirmes que registraste, corregiste o eliminaste algo: la herramienta únicamente prepara una vista previa y el usuario debe confirmarla en la aplicación. No prepares préstamos, cobros, transferencias entre cuentas, cambios, eliminaciones ni configuraciones; pedí usar el flujo existente o aclarar."});
let financeChat=financeModel.startChat(), financeTurns=0;
const financeWithTimeout=(promise,ms=30000)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>{financeChat=financeModel.startChat();financeTurns=0;reject(new Error("La consulta con IA tardó demasiado. Probá de nuevo o escribí el comando."));},ms);promise.then(v=>{clearTimeout(timer);resolve(v);},e=>{clearTimeout(timer);financeChat=financeModel.startChat();financeTurns=0;reject(e);});});
window.__nicsysGemini={
  async ask(text){ return this.askInput(text); },
  async askAudio(mimeType,data){ return this.askInput([{inlineData:{mimeType,data}},{text:"Interpretá el audio como una consulta o comando del usuario de NicSys Finance. Conservá sus palabras y contexto, no inventes datos. Para consultar usá la herramienta de solo lectura; para una operación prepará únicamente una propuesta que requiera confirmación explícita."}]); },
  async askInput(input){
    if(financeTurns>=12){ financeChat=financeModel.startChat(); financeTurns=0; }
    financeTurns++;
    let result=await financeWithTimeout(financeChat.sendMessage(input));
    let handled=false, prepared=false;
    for(let pass=0;pass<2;pass++){
      const calls=result.response.functionCalls(); if(!calls.length) return {handled,responded:true,text:result.response.text()||"No pude formular una respuesta con los datos disponibles."};
      const responses=[];
      for(const call of calls){
        let value={ok:false,error:"Herramienta no disponible."};
        try{ const fn=window.__nicsysAIRegistry&&window.__nicsysAIRegistry[call.name]; if(fn) value=await fn(call.args||{}); }
        catch(e){ value={ok:false,error:String(e&&e.message||"No se pudo completar la consulta.")}; }
        if(value&&value.ok){ handled=true; if(value.prepared) prepared=true; }
        responses.push({type:"functionResponse",functionResponse:{name:call.name,response:value}});
      }
      result=await financeWithTimeout(financeChat.sendMessage(responses));
    }
    return {handled,prepared,text:result.response.text()||"La consulta quedó limitada por seguridad. Probá con una pregunta más concreta."};
  },
  async analyzeReceipt(canvas,ocrText){
    const g=canvas.getContext("2d"), mime="image/jpeg", data=canvas.toDataURL(mime,.82).split(",")[1];
    const prompt="Analizá este comprobante financiero argentino junto con el texto OCR. Respondé únicamente JSON válido con campos: tipo (ticket, factura, transferencia, deposito, pago_tarjeta, compra_cuotas, prestamo, devolucion, recibo, otro), comercio, persona, monto (número o null), fecha (YYYY-MM-DD o null), medio (efectivo, digital, debito, credito, transferencia u otro), tarjeta, cuotas (número o null), texto. No infieras campos ausentes; usa null. No ejecutes ni registres nada. OCR: "+String(ocrText||"").slice(0,6000);
    const r=await getGenerativeModel(financeAI,{model:"gemini-3.8-flash",generationConfig:{responseMimeType:"application/json",maxOutputTokens:500}}).generateContent([{text:prompt},{inlineData:{mimeType:mime,data}}]);
    return JSON.parse(r.response.text());
  }
};

function wrapSnap(d){ return { id:d.id, exists:d.exists(), data:()=>d.data() }; }
function docRefShim(path){
  const ref = fsDoc(fsdb, path);
  return {
    get: async () => wrapSnap(await getDoc(ref)),
    set: (data) => setDoc(ref, data),
    update: (data) => updateDoc(ref, data),
    delete: () => deleteDoc(ref),
  };
}
function colRefShim(path){
  const cref = fsCollection(fsdb, path);
  const build = (constraints) => ({
    get: async () => {
      const snap = await getDocs(constraints.length? query(cref, ...constraints) : cref);
      return { docs: snap.docs.map(wrapSnap), empty: snap.empty, size: snap.size };
    },
    add: (data) => addDoc(cref, data),
    doc: (id) => docRefShim(`${path}/${id}`),
    orderBy: (f,dir) => build([...constraints, fsOrderBy(f, dir||'asc')]),
    limit: (n) => build([...constraints, fsLimit(n)]),
    onSnapshot: (cb) => onSnapshot(constraints.length? query(cref, ...constraints) : cref, (snap) => {
      cb({ docs: snap.docs.map(wrapSnap), empty: snap.empty, size: snap.size });
    }, (err) => console.error('onSnapshot error', path, err)),
  });
  return build([]);
}

async function importarDatosJSON(jsonText){
  const data = JSON.parse(jsonText);
  const COLS = ['tarjetas','movimientos','horas','productos','joyeria','botas','retirados','adelantos','prestamos_di','prestamos_recibi','terceros_mov','cobros','diasNoTrabajados','pagos_tarjeta','sabados_mes','wallet_cuentas','wallet_movs','wallet_cats'];
  for(const col of COLS){
    const items = data[col] || [];
    let batch = writeBatch(fsdb), n = 0;
    for(const item of items){
      const { id, ...rest } = item;
      const ref = fsDoc(fsdb, `${col}/${id}`);
      batch.set(ref, rest);
      n++;
      if(n % 400 === 0){ await batch.commit(); batch = writeBatch(fsdb); }
    }
    if(n % 400 !== 0) await batch.commit();
  }
  if(data.config_pay){ await setDoc(fsDoc(fsdb,'config/pay'), data.config_pay); }
}

// Puente hacia el resto de la app (que corre en un <script> clasico, no modulo,
// para que todos los onclick="..." del HTML sigan funcionando como siempre).
window.fbOnAuthStateChanged = (cb) => onAuthStateChanged(auth, user => { window.__nicsysUid=user&&user.uid||''; if(user&&window.vzCargarPreferencias) window.vzCargarPreferencias(user.uid); cb(user); });
window.fbSignIn = (email, pass) => signInWithEmailAndPassword(auth, email, pass);
window.fbSignOut = () => signOut(auth);
window.fbColRef = colRefShim;
window.fbDocRef = docRefShim;
window.fbImport = importarDatosJSON;
window.__fbReady = true;
window.dispatchEvent(new Event('fb-ready'));
</script>

function shiftYM(ym,delta){ let m=ym.m+delta, y=ym.y; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return {y,m}; }
function decToHM(dec){ const sign = dec<0?'-':''; const abs=Math.abs(dec); let hh=Math.floor(abs); let mm=Math.round((abs-hh)*60); if(mm===60){mm=0;hh++;} return hh>0? `${sign}${hh}h ${mm}m` : `${sign}${mm}m`; }
function diasHabilesEntre(y,m,hastaDia){
  let n=0; const d=new Date(y,m-1,1);
  while(d.getMonth()===m-1 && d.getDate()<=hastaDia){ const w=d.getDay(); if(w>=1&&w<=6)n++; d.setDate(d.getDate()+1); }
  return n;
}
function diasTrabajadosAuto(y,m){
  const now = new Date();
  const esMesActual = (now.getFullYear()===y && now.getMonth()+1===m);
  const hasta = esMesActual? now.getDate() : new Date(y,m,0).getDate();
  let n = diasHabilesEntre(y,m,hasta);
  const noTrab = diasNoTrabajados.filter(d=>{ const f=parseFechaFull(d.fecha); return f.y===y && f.m===m && f.d<=hasta; }).length;
  return Math.max(n-noTrab,0);
}

function calc(t){ const libre=(Number(t.limite)||0)-(Number(t.usado)||0); const pct=t.limite>0?Math.round((t.usado/t.limite)*100):0; return {...t,libre,porcentaje:pct}; }
function toNum(v){
  if(v===undefined||v===null) return 0;
  if(typeof v==='number') return isFinite(v)?rd2(v):0;
  let t=String(v).trim().replace(/[\s$]/g,'');
  if(!t) return 0;
  const neg=/^-/.test(t); t=t.replace(/^[-+]/,'');
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,'').replace(',','.');          // 41.000 · 5.000,02
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t=t.replace(/,/g,'');                           // 41,000.50
  else t=t.replace(',','.');                                                                  // 5000,02 · 5000.02
  const n=parseFloat(t); return isNaN(n)?0:rd2(neg?-n:n);
}
function parseFecha(f){
  if(!f) return 0;
  const parts = f.split('/').map(s=>parseInt(s));
  let d=parts[0]||0, m=parts[1]||0, y=parts[2];
  if(!y) y=new Date().getFullYear(); else if(y<100) y+=2000;
  return y*10000 + m*100 + d;
}
function sortDesc(arr){ return arr.slice().sort((a,b)=> parseFecha(b.fecha)-parseFecha(a.fecha)); }

const bqNorm=t=>String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function bqMonto(v){ const n=Number(v); if(!isFinite(n)) return ''; const a=Math.abs(rd2(n)), t=a.toFixed(2), e=t.split('.')[0], d=t.split('.')[1], mi=e.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return `${e},${d} ${e}.${d} ${mi},${d} ${e} ${mi} ${e}${d}`; }
function bqFecha(f){ if(!f) return ''; f=String(f);
  if(/^\d{4}-\d{2}-\d{2}/.test(f)){ const p=f.slice(0,10).split('-'); return `${p[2]}/${p[1]}/${p[0]} ${p[2]}/${p[1]}/${p[0].slice(2)} ${p[2]}/${p[1]} ${f.slice(0,10)}`; }
  const q=parseFechaFull(f), d=String(q.d).padStart(2,'0'), m=String(q.m).padStart(2,'0'); return `${f} ${d}/${m}/${q.y} ${d}/${m}/${String(q.y).slice(2)} ${d}/${m} ${q.y}-${m}-${d}`; }
function bqCoincide(query,campos){
  const toks=bqNorm(query).replace(/\$/g,' ').split(/\s+/).filter(Boolean); if(!toks.length) return true;
  const h=bqNorm((campos||[]).filter(x=>x!==undefined&&x!==null&&x!=='').join(' | '));
  return toks.every(t=>h.includes(t)); }

let suppressAutoStart = false;
async function boot(){
  const start = () => window.fbOnAuthStateChanged((user) => {
    if(user){
      db = { collection: window.fbColRef, doc: window.fbDocRef };
      if(suppressAutoStart) return;
      document.getElementById('lock').innerHTML = '';
      startApp();
    } else {
      db = null;
      unsub.forEach(u=>u&&u()); unsub=[];
      document.getElementById('app').style.display='none';
      document.getElementById('lock').style.display='flex';
      renderLogin();
    }
  });
  if(window.__fbReady) start(); else window.addEventListener('fb-ready', start, {once:true});
}

async function seedCollection(name, seedArr, withId){
  const snap = await db.collection(name).get();
  if(snap.empty && seedArr.length){
    for(const item of seedArr){
      if(withId){ const {id,...rest}=item; await db.collection(name).doc(id).set(rest); }
      else { await db.collection(name).add(item); }
    }
  }
}

async function migrateTarjetas(){
  for(const seed of SEED_TARJETAS){
    const ref = db.collection('tarjetas').doc(seed.id);
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data();
      const patch = {};
      if(!d.cierre) patch.cierre = seed.cierre;
      if(!d.vence) patch.vence = seed.vence;
      if(!d.logo) patch.logo = seed.logo;
      if(d.accent!==seed.accent) patch.accent = seed.accent;
      if(!d.tipo) patch.tipo = seed.tipo;
      if(Object.keys(patch).length) await ref.update(patch);
    }
  }
  // Unificar color por banco: todas las tarjetas del mismo banco deben verse igual,
  // sin importar si el documento tiene el id original o fue recreado a mano.
  const colorPorBanco = {};
  SEED_TARJETAS.forEach(s=>{ if(!colorPorBanco[s.bank]) colorPorBanco[s.bank]=s.accent; });
  try{
    const todas = await db.collection('tarjetas').get();
    for(const doc of todas.docs){
      const d = doc.data();
      const colorCorrecto = colorPorBanco[d.bank];
      if(colorCorrecto && d.accent!==colorCorrecto){
        await db.collection('tarjetas').doc(doc.id).update({accent: colorCorrecto});
      }
    }
  }catch(e){ console.error('no se pudo unificar colores por banco', e); }
}

function sabadosValidosPara(arr,y,m){
  if(!arr || !arr.length) return false;
  const correctos = sabadosDelMes(y,m).map(s=>s.day).sort((a,b)=>a-b);
  const actuales = arr.map(s=>s.day).sort((a,b)=>a-b);
  if(actuales.length!==correctos.length) return false;
  return actuales.every((dd,i)=>dd===correctos[i]);
}
async function forzarSabados(){
  const hoy = todayYM();
  sabados = sabadosDelMes(hoy.y, hoy.m);
  try{
    await guardarSabadosMes(hoy.y,hoy.m,sabados,rate);
    await db.doc('config/pay').update({sabados, sabadosMes: Number(claveSabadosMes(hoy.y,hoy.m))});
  }
  catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); return; }
  render();
}
async function ensureSabadosActuales(){
  const hoy = todayYM();
  const claveMes = Number(claveSabadosMes(hoy.y,hoy.m));
  const cfg = await db.doc('config/pay').get();
  const d = cfg.exists? cfg.data() : {};
  const claveAnterior=partesClaveSabadosMes(d.sabadosMes);
  if(Array.isArray(d.sabados)&&d.sabados.length){
    if(claveAnterior){
      const existente=await leerSabadosMes(claveAnterior.y,claveAnterior.m);
      if(!existente) await guardarSabadosMes(claveAnterior.y,claveAnterior.m,d.sabados,toNum(d.rate??rate));
    }else if(sabadosValidosPara(d.sabados,hoy.y,hoy.m)){
      const existente=await leerSabadosMes(hoy.y,hoy.m);
      if(!existente) await guardarSabadosMes(hoy.y,hoy.m,d.sabados,toNum(d.rate??rate));
    }else{
      const legado=await db.doc('sabados_mes/legacy-sin-periodo').get();
      if(!legado.exists) await db.doc('sabados_mes/legacy-sin-periodo').set({sabados:d.sabados,rate:toNum(d.rate??rate),nota:'Configuración anterior sin mes identificable'});
    }
  }
  const delMes=await leerSabadosMes(hoy.y,hoy.m);
  if(delMes&&Array.isArray(delMes.sabados)){
    sabados=delMes.sabados;
  }else if(Number(d.sabadosMes)===claveMes&&Array.isArray(d.sabados)){
    sabados=d.sabados;
    await guardarSabadosMes(hoy.y,hoy.m,sabados,toNum(d.rate??rate));
  }else{
    sabados=sabadosDelMes(hoy.y,hoy.m);
    await guardarSabadosMes(hoy.y,hoy.m,sabados,rate);
  }
  await db.doc('config/pay').update({sabados,sabadosMes:claveMes});
}

async function cargarConfiguracionSinEscrituras(){
  try{
    const cfg=await db.doc('config/pay').get();
    if(!cfg.exists) return;
    const d=cfg.data()||{};
    if(d.rate!==undefined&&d.rate!==null&&d.rate!==''&&Number.isFinite(Number(d.rate))) rate=Number(d.rate);
    if(d.base!==undefined&&d.base!==null&&d.base!==''&&Number.isFinite(Number(d.base))) base=Number(d.base);
    if(Array.isArray(d.sabados)) sabados=d.sabados;
    if(d.fechaCobro) fechaCobro=d.fechaCobro;
    if(d.diasTrabajados!==undefined&&d.diasTrabajados!==null&&Number.isFinite(Number(d.diasTrabajados))) diasTrabajados=Number(d.diasTrabajados);
    if(d.diasMes!==undefined&&d.diasMes!==null&&Number.isFinite(Number(d.diasMes))) diasMes=Number(d.diasMes);
  }catch(e){ console.error('No se pudo leer la configuración guardada',e); }
}

/* ===== Deudas de terceros: tarjetas, WhatsApp y Panel Maestro ===== */
function fechaCorta(f){ const q=parseFechaFull(f); return String(q.d).padStart(2,'0')+'/'+String(q.m).padStart(2,'0')+'/'+String(q.y).slice(2); }
function fechaOrden(f){ const q=parseFechaFull(f); return q.y*10000+q.m*100+q.d; }
function renderTercerosCards(tr,nombres,total){
  _tercNombres=nombres;
  const esc=escaparHTMLHistorial;
  const head=`<div class="minirow" style="border-left:3px solid #f59e0b"><span><b>Total deudas de terceros</b></span><span class="amt" style="color:#f59e0b">${money(total)}</span></div>`;
  if(!nombres.length) return `<div class="empty">Sin deudas de terceros cargadas.</div>`;
  return head+nombres.map((n,i)=>{
    const g=tr[n], open=!!terceroOpen[n];
    const pend=g.items.filter(x=>!x.cobrado);
    const desde=pend.length? fechaCorta(pend.slice().sort((x,y)=>fechaOrden(x.fecha)-fechaOrden(y.fecha))[0].fecha):'—';
    const detalle=open? `<div class="debt-detail">${g.items.slice().sort((x,y)=>fechaOrden(y.fecha)-fechaOrden(x.fecha)).map(it=>`
      <div class="debt-row${it.cobrado?' done':''}">
        <div class="debt-row-main"><b>${esc(it.motivo)}${it.tarjetaNom?' · '+esc(it.tarjetaNom):''}</b><span>${fechaCorta(it.fecha)}</span></div>
        <div class="debt-row-obs">${it.obs?esc(it.obs):'<i>Sin observaciones</i>'}</div>
        <div class="debt-row-foot"><span class="amt">${money(it.monto)}</span><label><input type="checkbox" ${it.cobrado?'checked':''} onchange='toggleDeudaTercero("${it.col}",${JSON.stringify(it.id)},"${it.field}",this.checked)'> devuelto</label></div>
      </div>`).join('')}</div>`:'';
    return `<article class="debt-card${pend.length?'':' debt-paid'}">
      <div class="debt-name">${esc(n)}</div>
      <div class="debt-amount">${money(g.pendiente)}</div>
      <div class="debt-meta"><div><small>Deudas pendientes</small><b>${pend.length}</b></div><div><small>Desde</small><b>${desde}</b></div></div>
      <div class="debt-actions">
        <button type="button" class="debt-more" aria-expanded="${open}" onclick="toggleTerceroIdx(${i})">${open?'Ver menos':'Ver más'}</button>
        <button type="button" class="debt-send" ${pend.length?'':'disabled'} onclick="enviarWhatsAppTercero(${i})">Enviar</button>
      </div>
    </article>${detalle}`;
  }).join('');
}
function toggleTerceroIdx(i){ const n=_tercNombres[i]; if(n===undefined) return; terceroOpen[n]=!terceroOpen[n]; render(); }
function normalizarTelWA(t){
  let d=String(t||'').replace(/\D/g,'').replace(/^0+/,'');
  if(!d) return '';
  return d.startsWith('54')? d : '549'+d;
}
function mensajeDeudaTercero(nombre,pend){
  const lineas=pend.slice().sort((x,y)=>fechaOrden(x.fecha)-fechaOrden(y.fecha))
    .map(it=>`• ${fechaCorta(it.fecha)} – $${fmt(it.monto)} (${it.obs||it.motivo})`).join('\n');
  const total=pend.reduce((a,it)=>a+(it.monto||0),0);
  return `¡Hola, ${nombre}!\n\nTe comparto el detalle de tu saldo pendiente:\n\n${lineas}\n\nTOTAL A PAGAR: $${fmt(total)}\n\nPodés realizar la transferencia a los siguientes datos:\n\nAlias: ${tercerosCfg.alias}\nBanco: ${tercerosCfg.banco}\n\nMuchas gracias.\n\nMensaje automático de NicSys.`;
}
function enviarWhatsAppTercero(i){
  const n=_tercNombres[i]; const g=n!==undefined?tercerosResumen()[n]:null;
  if(!g) return;
  const pend=g.items.filter(x=>!x.cobrado);
  if(!pend.length){ alert('Esta persona no tiene deuda pendiente.'); return; }
  if(!tercerosCfg.alias||!tercerosCfg.banco){ alert('Primero cargá el alias y el banco en Panel Maestro > Deudas de terceros.'); openMasterPanel(); return; }
  const tel=normalizarTelWA(tercerosCfg.tels[n]);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(mensajeDeudaTercero(n,pend))}`,'_blank','noopener');
}
function seccionTercerosMaestro(){
  const tr=tercerosResumen(), esc=escaparHTMLHistorial;
  _tercMaestro=Object.keys(tr).sort((a,b)=>a.localeCompare(b,'es'));
  const lista=_tercMaestro.length? _tercMaestro.map((n,i)=>`<div class="minirow" style="align-items:center;gap:8px"><span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis">${esc(n)}</b><span class="hint">${tercerosCfg.tels[n]?'WhatsApp: '+esc(tercerosCfg.tels[n]):'Sin WhatsApp cargado'}</span></span><button class="btn" type="button" onclick="editarTercero(${i})">Editar</button></div>`).join('')
    : '<div class="empty">Todavía no hay personas con deudas.</div>';
  return `<section class="master-card">
    <div class="master-card-head"><div class="master-card-name"><b>Deudas de terceros</b><small>Datos de pago y personas</small></div></div>
    <div class="master-stats">
      <div class="master-stat">Alias<b>${esc(tercerosCfg.alias)||'Sin cargar'}</b></div>
      <div class="master-stat">Banco<b>${esc(tercerosCfg.banco)||'Sin cargar'}</b></div>
    </div>
    <div class="master-edit-grid"><button class="btn primary" type="button" onclick="openPagoTerceros()">Editar datos de pago</button></div>
    ${lista}
  </section>`;
}

  const esc=escaparHTMLHistorial;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Datos de pago</h3>
    <p class="hint">Se incluyen en el mensaje de WhatsApp que enviás a quienes te deben.</p>
    <div class="field"><label>Alias</label><input id="tc_alias" autocomplete="off" autocapitalize="none" value="${esc(tercerosCfg.alias)}"></div>
    <div class="field"><label>Banco</label><input id="tc_banco" autocomplete="off" value="${esc(tercerosCfg.banco)}"></div>
    <div class="modal-actions"><button class="btn" onclick="openMasterPanel()">Cancelar</button><button class="btn primary" onclick="guardarPagoTerceros()">Guardar</button></div>
  </div></div>`;

async function guardarConfigTerceros(cambios){
  const snap=await db.doc('config/terceros').get(), cur=snap.exists?snap.data():{};
  const nuevo={alias:cur.alias||'',banco:cur.banco||'',tels:cur.tels||{},...cambios};
  await db.doc('config/terceros').set(nuevo);
  tercerosCfg={alias:nuevo.alias,banco:nuevo.banco,tels:nuevo.tels};
}
async function guardarPagoTerceros(){
  const alias=document.getElementById('tc_alias').value.trim(), banco=document.getElementById('tc_banco').value.trim();
  try{ await guardarConfigTerceros({alias,banco}); openMasterPanel(); }
  catch(e){
    console.error(e);
    alert(e&&e.code==='permission-denied'?'No se pudo guardar: Firestore rechazó el permiso. Revisá las reglas.':'No se pudo guardar. Probá de nuevo.');
  }
}
function editarTercero(i){
  const n=_tercMaestro[i]; if(n===undefined) return; const esc=escaparHTMLHistorial;
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Editar persona</h3>
    <div class="field"><label>Nombre</label><input id="et_nombre" autocomplete="off" value="${esc(n)}"></div>
    <div class="field"><label>WhatsApp (con código de área)</label><input id="et_tel" inputmode="tel" placeholder="Ej: 1123456789" value="${esc(tercerosCfg.tels[n]||'')}"></div>
    <p class="hint">Si cambiás el nombre, se actualiza en todas sus deudas.</p>
    <div class="modal-actions"><button class="btn" onclick="openMasterPanel()">Cancelar</button><button class="btn primary" onclick="guardarTercero(${i})">Guardar</button></div>
  </div></div>`;

async function guardarTercero(i){
  const viejo=_tercMaestro[i]; if(viejo===undefined) return;

  const anio=p[2]?(p[2]<100?2000+p[2]:p[2]):anioSinFecha;

}

}

function calcularHaberes(){

  const joyeriaMes = joyeria.filter(esDeEsteMes);

  const diasNoMes = diasNoTrabajados.filter(esDeEsteMes);

  const sabTotal = sabados.reduce((a,s)=>a+(parseFloat(s.hours)||0),0)*rate;
  const horasTotal = horasMes.reduce((a,h)=>a+(h.total||0),0);

  const joyTotal = joyeriaMes.reduce((a,j)=>a+(j.cant||0)*TARIFA_JOYERIA,0);
  const botTotal = botasMes.reduce((a,b)=>a+(b.cant||0)*TARIFA_BOTA,0);
  const retTotal = retiradosMes.reduce((a,r)=>a+(r.cant||0)*TARIFA_RETIRO,0);
  const adelTotal = adelantosMes.reduce((a,ad)=>a+(ad.monto||0),0);
  const prestadoCobrado = prestamosDi.reduce((a,p)=>a+(p.cobrado?(p.monto||0):0),0);
  const prestamoPendiente = prestamosRecibi.filter(p=>!p.pagado && prestamoEnPeriodo(p)).reduce((a,p)=>a+(p.monto||0),0);
  const prestamoFuturo = prestamosRecibi.filter(p=>!p.pagado && !prestamoEnPeriodo(p)).reduce((a,p)=>a+(p.monto||0),0);
  diasMes = diasHabilesMes(hoyYM.y, hoyYM.m);
  diasTrabajados = diasTrabajadosAuto(hoyYM.y, hoyYM.m);
  const HORAS_DIA_LABORAL = 8;
  const valorDia = rate * HORAS_DIA_LABORAL;
  const diasNoTotal = diasNoMes.reduce((a,d)=>a+valorDia,0);
  const neto = base + sabTotal + horasTotal + prodComision + joyTotal + botTotal + retTotal - adelTotal + prestadoCobrado - prestamoPendiente - diasNoTotal;
  const deudaTarjetas = tarjetas.reduce((a,t)=>a+t.usado,0);

function escaparHTMLHistorial(valor){

function partesFechaHistorial(fecha,anioFallback){
  const p=String(fecha||'').split('/').map(Number), d=p[0], m=p[1];
  if(!d||!m||m<1||m>12||d<1||d>31) return null;
  let y=p[2]||anioFallback;
  if(y<100) y+=2000;
  return {d,m,y};

function fechaOrdenHistorial(fecha,anioFallback){
  const p=partesFechaHistorial(fecha,anioFallback);
  return p?p.y*10000+p.m*100+p.d:0;
}
function fechaCompletaHistorial(fecha,anioFallback){
  const p=partesFechaHistorial(fecha,anioFallback);

function registrosDelPeriodoHaberes(items,periodo){

    const p=partesFechaHistorial(it.fecha,periodo.y);

  }).slice().sort((a,b)=>fechaOrdenHistorial(a.fecha,periodo.y)-fechaOrdenHistorial(b.fecha,periodo.y));

function crearReporteHaberes(periodo,colecciones,cierre,config,sabadosMesGuardados){

  const ratePeriodo=toNum(cierre?.rate??sabadosMesGuardados?.rate??config.rate??rate);
  const basePeriodo=toNum(cierre?.base??sabadosMesGuardados?.base??config.base??base);
  const sabados=Array.isArray(sabadosMesGuardados?.sabados)&&sabadosMesGuardados.sabados.length?sabadosMesGuardados.sabados:
    (Array.isArray(cierre?.sabados)&&cierre.sabados.length?cierre.sabados:
    (esActual&&Array.isArray(config.sabados)?config.sabados:[]));

    horas,horasCantidad,horasTotal,sabadosHoras,sabadosTotal,productos,ventasProductos,comisionProductos,
    joyeria,joyeriaUnidades,comisionJoyeria,botas,botasUnidades,comisionBotas,
    retirados,retirosUnidades,comisionRetiros,adelantos,adelantosTotal,diasNo,diasNoDescuento,neto};

function cargarHistorialHaberes(){
  const mesEl=document.getElementById('histHabMes'), anioEl=document.getElementById('histHabAnio');
  if(!mesEl||!anioEl||!db) return;
  historialHaberesPeriodo={m:parseInt(mesEl.value,10),y:parseInt(anioEl.value,10)};
  const periodo={...historialHaberesPeriodo}, solicitud=++historialHaberesSolicitud;
  historialHaberesReporte=null; historialHaberesError=''; historialHaberesCargando=true; render();
  Promise.all([
    db.collection('cobros').get(),
    db.doc('config/pay').get(),
    db.doc(`sabados_mes/${claveSabadosMes(periodo.y,periodo.m)}`).get(),
    ...HISTORIAL_HABERES_COLLECTIONS.map(col=>db.collection(col).get())
  ]).then(resultados=>{
    if(solicitud!==historialHaberesSolicitud) return;
    const cobros=resultados[0].docs.map(d=>({id:d.id,...d.data()}));
    const cfgSnap=resultados[1], config=cfgSnap.exists?cfgSnap.data():{};
    const sabadosSnap=resultados[2], sabadosMesGuardados=sabadosSnap.exists?sabadosSnap.data():null;
    const colecciones={};
    HISTORIAL_HABERES_COLLECTIONS.forEach((col,i)=>{ colecciones[col]=resultados[i+3].docs.map(d=>({id:d.id,...d.data()})); });
    historialHaberesReporte=crearReporteHaberes(periodo,colecciones,cierreGuardadoParaPeriodo(cobros,periodo),config,sabadosMesGuardados);
  }).catch(e=>{
    if(solicitud===historialHaberesSolicitud){ console.error('historial de haberes',e); historialHaberesError='No se pudo cargar el historial. Probá de nuevo.'; }
  }).finally(()=>{
    if(solicitud===historialHaberesSolicitud){ historialHaberesCargando=false; render(); }
  });
}

async function togglePrestamo(col,id,val,field){
  try{ await db.collection(col).doc(id).update({[field]:val}); }
  catch(e){ console.error(e); alert('No se pudo actualizar. Probá de nuevo.'); }

let ultimoCierreAuto=null, cierreAutoEnCurso=false, cierreAutoDia='';
function ahoraNS(){ return new Date(); }
/* Cierre automático de haberes: guarda (una sola vez, sin pisar nada) el mes anterior completo en «cobros»,
   que es lo que lee Historial de haberes. Deja el mes nuevo en cero y adelanta la fecha de cobro. */
async function cerrarMesesPendientes(){
  if(!db||cierreAutoEnCurso) return;
  const hoyStr=fmtDate(ahoraNS());
  if(cierreAutoDia===hoyStr) return;
  cierreAutoEnCurso=true;
  try{
    const hoy=todayYM(), idx=q=>q.y*12+q.m;
    const cobros=(await db.collection('cobros').get()).docs.map(d=>({id:d.id,...d.data()}));
    let ultimo=null;
    cobros.forEach(c=>{ const f=partesFechaHistorial(c.fechaCobro,hoy.y); if(!f) return; const per=shiftYM({y:f.y,m:f.m},-1); if(idx(per)<idx(hoy)&&(!ultimo||idx(per)>idx(ultimo))) ultimo=per; });
    const minimo=shiftYM(hoy,-3), desde=ultimo?shiftYM(ultimo,1):shiftYM(hoy,-1);
    const inicio=idx(desde)<idx(minimo)?minimo:desde;
    const pendientes=[]; for(let q=inicio;idx(q)<idx(hoy);q=shiftYM(q,1)) pendientes.push(q);
    // Mes nuevo en cero: archiva los sábados del mes anterior y arranca el actual sin horas.
    let cfgSnap=await db.doc('config/pay').get(), cfg=cfgSnap.exists?cfgSnap.data():{};
    if(Number(cfg.sabadosMes)!==Number(claveSabadosMes(hoy.y,hoy.m))){
      await ensureSabadosActuales();
      cfgSnap=await db.doc('config/pay').get(); cfg=cfgSnap.exists?cfgSnap.data():{};
    }
    const faltan=pendientes.filter(per=>!cierreGuardadoParaPeriodo(cobros,per));
    if(faltan.length){
      const colecciones={};
      const res=await Promise.all(HISTORIAL_HABERES_COLLECTIONS.map(col=>db.collection(col).get()));
      HISTORIAL_HABERES_COLLECTIONS.forEach((col,i)=>{ colecciones[col]=res[i].docs.map(d=>({id:d.id,...d.data()})); });
      const strip=arr=>arr.map(({id,...r})=>r);
      for(const per of faltan){
        const ref=db.collection('cobros').doc(`auto-${per.y}-${String(per.m).padStart(2,'0')}`);
        if((await ref.get()).exists) continue;
        const sd=await db.doc(`sabados_mes/${claveSabadosMes(per.y,per.m)}`).get();
        const rep=crearReporteHaberes(per,colecciones,null,cfg,sd.exists?sd.data():null);
        const sig=shiftYM(per,1), ahora=ahoraNS();
        const snap={auto:true,periodo:{y:per.y,m:per.m},fechaCobro:fmtDate(new Date(sig.y,sig.m-1,1)),fechaPagoReal:'',
          cerradoEl:fmtDate(ahora),cerradoISO:ahora.toISOString(),base:rep.base,rate:rep.rate,sabados:rep.sabados,
          horas:strip(rep.horas),productos:strip(rep.productos),joyeria:strip(rep.joyeria),botas:strip(rep.botas),
          retirados:strip(rep.retirados),adelantos:strip(rep.adelantos),diasNoTrabajados:strip(rep.diasNo),
          totales:{sueldoBase:rep.base,sabados:rep.sabadosTotal,horasExtras:rep.horasTotal,comisionProductos:rep.comisionProductos,
            comisionJoyeria:rep.comisionJoyeria,comisionBotas:rep.comisionBotas,comisionRetiros:rep.comisionRetiros,
            adelantos:rep.adelantosTotal,diasNoTrabajados:rep.diasNoDescuento},neto:rep.neto};
        await ref.set(JSON.parse(JSON.stringify(snap)));
        cobros.push({id:ref.id,...snap});
        if(!ultimo||idx(per)>idx(ultimo)) ultimo=per;
      }
    }
    // La fecha del próximo cobro avanza sola cuando ya pasó.
    const f=parseFechaFull(fechaCobro); let fc=new Date(f.y,f.m-1,f.d); const h0=ahoraNS(); h0.setHours(0,0,0,0);
    let cambio=false;
    for(let i=0;i<12&&fc<=h0;i++){ fc=new Date(fc.getFullYear(),fc.getMonth()+1,fc.getDate()); cambio=true; }
    if(cambio){ fechaCobro=fmtDate(fc); await db.doc('config/pay').update({fechaCobro}); }
    ultimoCierreAuto=ultimo; cobrosHist=[]; cierreAutoDia=hoyStr;
    render();
  }catch(e){ console.error('cierre automático',e); }
  finally{ cierreAutoEnCurso=false; }
}

  const libreRaw=document.getElementById(`master_libre_${index}`).value.trim();
  const limite=Number(limRaw), disponible=Number(libreRaw);
  const cierre=document.getElementById(`master_cierre_${index}`).value.trim();
  const vence=document.getElementById(`master_vence_${index}`).value.trim();
  if(!limRaw||!libreRaw||!Number.isFinite(limite)||!Number.isFinite(disponible)||limite<0){
    alert('Ingresá un límite válido y un disponible numérico.'); return;
  }
  if(disponible>limite){
    alert('El disponible no puede superar el límite. Sí puede ser negativo.'); return;
  }
  if(!fechaTarjetaValida(cierre)||!fechaTarjetaValida(vence)){
    alert('Las fechas deben estar vacías o usar DD/MM, con día y mes válidos.'); return;
  }
  const usado=Math.round((limite-disponible)*100)/100;
  const patch={limite,usado,cierre,vence};
  const mostrarValor=v=>hideAmounts?'(oculto)':'$'+fmt(v);
  const detalle=`Tarjeta: ${t.name||'Tarjeta'}\nLímite: ${mostrarValor(t.limite)} → ${mostrarValor(limite)}\nDisponible: ${mostrarValor(t.libre)} → ${mostrarValor(disponible)}\nCierre: ${t.cierre||'—'} → ${cierre||'—'}\nVencimiento / resumen: ${t.vence||'—'} → ${vence||'—'}`;
  confirmarSiNo('¿Guardar estos cambios?',detalle,async()=>{
    await db.collection('tarjetas').doc(t.id).update(patch);
    tarjetas=tarjetas.map((item,i)=>i===index?calc({...item,...patch}):item);
    closeModal();
    render();
  },()=>openMasterPanel(index));
}

function recalcularCicloAutomatico(){
  const elPago=document.getElementById('m_ciclo');
  if(elPago) elPago.dataset.manual='';
  updateCuotaPreview();
}
function updateCuotaPreview(){
  const elMonto=document.getElementById('m_monto'), elCuotas=document.getElementById('m_cuotas'), out=document.getElementById('m_cuota_preview');
  const elCard=document.getElementById('m_card'), elFecha=document.getElementById('m_fecha'), elPago=document.getElementById('m_ciclo');
  if(!elMonto||!out) return;
  const t=tarjetas.find(x=>x.id===elCard.value);
  const fecha=(elFecha.value||'').trim();
  if(t && fecha && elPago && !elPago.dataset.manual){
    const auto=primerPagoAuto({fecha},t);
    if(![...elPago.options].some(o=>+o.value===auto)) elPago.insertAdjacentHTML('beforeend',`<option value="${auto}">${cicloLabel(auto)}</option>`);
    elPago.value=auto;
  }
  const monto=toNum(elMonto.value), cuotas=parseInt(elCuotas.value)||1;
  const primer=elPago? parseInt(elPago.value):null;
  if(monto<=0 || !primer){ out.textContent=''; return; }
  const meses=[]; for(let i=0;i<cuotas;i++) meses.push(cicloLabel(addMonthsCiclo(primer,i)));
  let html = cuotas>1 ? `<b>${cuotas} cuotas de $${fmt(monto/cuotas)}</b><br>Se pagan en: ${meses.join(' · ')}` : `Un solo pago de <b>$${fmt(monto)}</b> en ${meses[0]}`;
  const fechaObj=parseFechaFull(fecha);
  const cicloCompra=cicloDeFecha(fechaObj,t&&t.cierre);
  const posteriorAlCierre=!!(t&&t.cierre&&cicloCompra!==fechaObj.y*100+fechaObj.m);
  if(posteriorAlCierre&&!elPago?.dataset.manual) html += `<br><span style="color:#10b981">Compra posterior al cierre: pasa automáticamente al pago de ${cicloLabel(primer)}.</span>`;
  const pd=fechaVencimientoCiclo(primer,cardInfo(t).vd);
  html += pd>=periodoFin() ? `<br><span style="color:#10b981">${premiumIcon("✅")} No se resta del cobro del ${fechaCobro}: queda en Saldo tarjeta futura.</span>` : `<br><span style="color:#f59e0b">${premiumIcon("⚠")} Vence antes del ${fmtDate(periodoFin())}: se resta del cobro del ${fechaCobro}.</span>`;
  out.innerHTML = html;
}
async function saveMov(id,_ok){
  if(id&&!_ok){ nsConfirmCambios(()=>saveMov(id,true)); return; }
  const cardId = document.getElementById('m_card').value;
  const fecha = document.getElementById('m_fecha').value.trim();
  const horaVal = document.getElementById('m_hora').value.trim();
  const monto = toNum(document.getElementById('m_monto').value);
  const cuotas = parseInt(document.getElementById('m_cuotas').value)||1;
  const primerPago = parseInt(document.getElementById('m_ciclo').value);
  const valorCuota = Math.round((monto/cuotas)*100)/100;
  const tipo = document.getElementById('m_tipo').value.trim();
  const categoria = document.getElementById('m_cat').value;
  const obs = document.getElementById('m_obs').value.trim();
  const esTercero = document.getElementById('m_tercero_sel').value==='otro';
  const tercero = esTercero? document.getElementById('m_tercero').value.trim() : '';
  const t = tarjetas.find(x=>x.id===cardId);
  if(!t){ alert('Elegí una tarjeta.'); return; }
  if(monto<=0){ alert('El monto tiene que ser mayor a 0.'); return; }
  if(!fecha){ alert('Falta la fecha.'); return; }
  if(esTercero && !tercero){ alert('Escribí a quién le corresponde el gasto.'); return; }
  const prevForTercero = id? movimientos.find(x=>x.id===id) : null;
  const terceroCobrado = tercero? (prevForTercero && prevForTercero.tercero===tercero ? !!prevForTercero.terceroCobrado : false) : false;
  const hora = horaVal? horaVal+'h' : '';
  try{
    if(id){
      const prev = movimientos.find(x=>x.id===id);
      await db.collection('movimientos').doc(id).update({tarjetaId:cardId, tarjeta:t.name, monto, cuotas, valorCuota, primerPago, tipo, fecha, hora, categoria, obs, tercero, terceroCobrado});
      if(prev){
        const prevCard = tarjetas.find(x=>x.id===prev.tarjetaId);
        if(prevCard){
          await db.collection('tarjetas').doc(prevCard.id).update({usado: rd2(Math.max(prevCard.usado-prev.monto,0))});
        }
        const freshDoc = await db.doc(`tarjetas/${cardId}`).get();
        const baseUsado = freshDoc.exists? freshDoc.data().usado : t.usado;
        await db.collection('tarjetas').doc(cardId).update({usado: rd2(baseUsado+monto)});
      }
    } else {
      await db.collection('movimientos').add({tarjetaId:cardId, tarjeta:t.name, monto, cuotas, valorCuota, primerPago, tipo, fecha, hora, categoria, obs, tercero, terceroCobrado});
      await db.collection('tarjetas').doc(cardId).update({usado: rd2(t.usado+monto)});
    }
  }catch(e){ console.error(e); alert('No se pudo guardar el movimiento. Probá de nuevo.'); return; }
  closeModal();
}

  const m = movimientos.find(x=>x.id===id);
