function detPersona(n){ if(typeof dtAbrir==='function'){ mdCerrar(); dtAbrir(n); return true; } return false; }
function abrir(k){ const i=String(k).indexOf(':'), t=k.slice(0,i), id=k.slice(i+1); let ok=false;
  try{ ok=t==='mov'?detMov(id):t==='wl'?detWl(id):t==='dti'?detDtItem(id):t==='dtp'?detDtPago(id):t==='dtpersona'?detPersona(id):false; }catch(e){ console.error('detalle',e); }
  if(!ok) show({sup:'Movimiento',titulo:'No disponible',rows:R('Aviso','No encontré los datos de este movimiento. Puede haber sido eliminado.')}); }
document.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('[data-md]'); if(!el) return; const x=e.target.closest('button,a,input,select,textarea,label'); if(x&&x!==el) return; e.preventDefault(); abrir(el.getAttribute('data-md')); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const s=document.getElementById('mdSheet'); if(s&&!s.hidden){ mdCerrar(); e.stopPropagation(); return; } }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-md]')){ e.preventDefault(); abrir(e.target.getAttribute('data-md')); } },true);
window.mdAbrir=abrir; window.mdCerrar=mdCerrar;
})();

<script id="terceros-module">
/* ===== NicSys Finance V20 · DEUDAS DE TERCEROS =====
   Conceptos independientes + pagos parciales con imputación automática (primero la deuda de menor saldo).
   Fuentes (sin duplicar): consumos de tarjeta con tercero (movimientos), préstamos en efectivo (prestamos_di)
   y conceptos/pagos propios del módulo (terceros_mov). Los cobros se acreditan una sola vez en wallet_movs. */
const dt={abierto:null,tab:'conceptos',busq:'',busqDet:'',verTodo:false,busy:false,nombres:[]};
const dtEsc=v=>escaparHTMLHistorial(v);
const dtC=x=>Math.round((Number(x)||0)*100);
const dtP=c=>c/100;
const p2dt=n=>String(n).padStart(2,'0');
const dtISOf=f=>{ const q=parseFechaFull(f); return `${q.y}-${p2dt(q.m)}-${p2dt(q.d)}`; };
const dtCorta=iso=>{ const p=String(iso||'').slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:'—'; };
const dtHoy=()=>{ const d=ahoraNS(); return `${d.getFullYear()}-${p2dt(d.getMonth()+1)}-${p2dt(d.getDate())}`; };
const dtM=v=>money(v);
const dtMs=(v,sg)=>{ const s=sg+'$'+fmt(Math.abs(v)); return hideAmounts?`<span class="blurred">${s}</span>`:s; };
const DT_COLORES=['#2f6bff','#12b981','#f59e0b','#8b5cf6','#ef4444','#0ea5e9','#ec4899','#14b8a6'];
function dtColor(n){ let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))>>>0; return DT_COLORES[h%DT_COLORES.length]; }
const dtIni=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';

/* ---------- cálculo: conceptos, pagos e imputación ---------- */
function dtCalc(opt){
  opt=opt||{}; const quitar=new Set(opt.quitar||[]), per={}, get=n=>per[n]||(per[n]={nombre:n,items:[],pagos:[]});
  (typeof movimientos!=='undefined'?movimientos:[]).forEach(m=>{ if(!m.tercero) return;
    get(m.tercero).items.push({key:'movimientos:'+m.id,col:'movimientos',id:m.id,tipo:'tarjeta',motivo:m.tipo||m.categoria||'Consumo con tarjeta',obs:m.obs||'',tarjetaNom:m.tarjeta||'',fecha:m.fecha,iso:dtISOf(m.fecha),c:dtC(m.monto),flag:!!m.terceroCobrado,auto:!!m.terceroCobradoAuto,field:'terceroCobrado',autoField:'terceroCobradoAuto',creado:''}); });
  (typeof prestamosDi!=='undefined'?prestamosDi:[]).forEach(p=>{ if(!p.aQuien) return;
    get(p.aQuien).items.push({key:'prestamos_di:'+p.id,col:'prestamos_di',id:p.id,tipo:'efectivo',motivo:p.concepto||'Préstamo en efectivo',obs:p.obs||'',tarjetaNom:'',fecha:p.fecha,iso:dtISOf(p.fecha),c:dtC(p.monto),flag:!!p.cobrado,auto:!!p.cobradoAuto,field:'cobrado',autoField:'cobradoAuto',creado:''}); });
  const movs=(typeof tercerosMov!=='undefined'?tercerosMov:[]).filter(x=>!quitar.has(x.id)).concat(opt.agregar||[]);
  movs.forEach(x=>{ const n=String(x.persona||'').trim(); if(!n) return;
    if(x.kind==='concepto') get(n).items.push({key:'terceros_mov:'+x.id,col:'terceros_mov',id:x.id,tipo:'manual',motivo:x.desc||'Deuda',obs:x.obs||'',tarjetaNom:'',fecha:dtCorta(x.fechaISO),iso:x.fechaISO||dtISOf(x.fecha),c:dtC(x.monto),flag:false,auto:false,creado:x.creadoISO||''});
    else if(x.kind==='pago') get(n).pagos.push({...x,persona:n}); });
  Object.values(per).forEach(g=>{
    g.items.forEach(it=>{ it.legacy=it.flag&&!it.auto; it.saldoC=it.legacy?0:it.c; it.pagadoC=it.legacy?it.c:0; });
    g.pagos.sort((a,b)=>(String(a.fechaISO)+(a.creadoISO||'')).localeCompare(String(b.fechaISO)+(b.creadoISO||'')));
    g.pagos.forEach(p=>{ let pool=dtC(p.monto); p.aplic=[];
      const pasada=ok=>{ const cand=g.items.filter(it=>it.saldoC>0&&ok(it)).sort((a,b)=>a.saldoC-b.saldoC||String(a.iso).localeCompare(String(b.iso))||a.key.localeCompare(b.key));
        for(const it of cand){ if(pool<=0) break; const x=Math.min(pool,it.saldoC); it.saldoC-=x; it.pagadoC+=x; pool-=x; p.aplic.push({key:it.key,motivo:it.motivo,fecha:it.fecha,c:x,cancela:it.saldoC===0}); } };
      pasada(it=>it.iso<=p.fechaISO); pasada(()=>true); p.sobraC=pool; });
    g.items.forEach(it=>{ it.monto=dtP(it.c); it.saldo=dtP(it.saldoC); it.pagado=dtP(it.pagadoC); });
    g.totalC=g.items.reduce((a,i)=>a+i.c,0); g.pendienteC=g.items.reduce((a,i)=>a+i.saldoC,0); g.cobradoC=g.totalC-g.pendienteC;
    g.total=dtP(g.totalC); g.pendiente=dtP(g.pendienteC); g.cobrado=dtP(g.cobradoC); g.pct=g.totalC>0?Math.round(g.cobradoC/g.totalC*100):0;
    const pend=g.items.filter(i=>i.saldoC>0); g.pendientes=pend.length; g.desde=pend.length?pend.map(i=>i.iso).sort()[0]:'';
    g.eventos=[...g.items.map(i=>({t:'deuda',iso:i.iso,creado:i.creado,titulo:i.motivo,sub:[i.tarjetaNom,i.obs].filter(Boolean).join(' · '),c:i.c,item:i})),
               ...g.pagos.map(p=>({t:'cobro',iso:p.fechaISO,creado:p.creadoISO||'',titulo:'Cobro',sub:dtMedioTxt(p),c:dtC(p.monto),pago:p}))]
      .sort((a,b)=>(String(a.iso)+a.creado).localeCompare(String(b.iso)+b.creado));
    let run=0; g.eventos.forEach(e=>{ if(e.t==='deuda'){ if(!e.item.legacy) run+=e.c; } else run-=e.c; e.run=Math.max(run,0); });
  });
  return per; }
function dtMedioTxt(p){ const cu=(window.__wl&&window.__wl.state.cuentas||[]).find(c=>c.id===p.cuentaId);
  return (p.medio==='efectivo'?'Efectivo':'Dinero digital')+(cu?' · '+cu.nombre:''); }
function dtLista(){ const C=dtCalc(); return Object.values(C).sort((a,b)=>b.pendienteC-a.pendienteC||a.nombre.localeCompare(b.nombre,'es')); }

/* compatibilidad: el resto de la app sigue leyendo tercerosResumen() */
function tercerosResumen(){ const C=dtCalc(), map={};
  Object.keys(C).forEach(n=>{ const g=C[n]; map[n]={pendiente:g.pendiente,items:g.items.map(it=>({tipo:it.tipo,motivo:it.motivo,obs:it.obs,tarjetaNom:it.tarjetaNom,fecha:it.fecha,monto:it.saldoC>0?it.saldo:it.monto,detalle:it.motivo,cobrado:it.saldoC<=0,id:it.id,col:it.col,field:it.field}))}; });
  return map; }

/* ---------- búsqueda ---------- */
function dtEvCoincide(q,g,e){ const p=e.pago;
  return bqCoincide(q,[g.nombre,e.titulo,e.sub,e.t==='cobro'?'cobro pago':'deuda concepto',bqFecha(e.iso),bqMonto(dtP(e.c)),p&&p.aplic?p.aplic.map(a=>a.motivo).join(' '):'',e.item&&e.item.tipo==='tarjeta'?'tarjeta':e.item&&e.item.tipo==='efectivo'?'efectivo prestamo':'']); }
function dtPersonaCoincide(q,g){ return !q.trim()||bqCoincide(q,[g.nombre])||g.eventos.some(e=>dtEvCoincide(q,g,e)); }

/* ---------- acciones de datos ---------- */
function dtNuevoId(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
async function dtSincronizar(nombre,opt){
  const g=dtCalc(opt)[nombre]; if(!g) return;
  for(const it of g.items){ if(it.col==='terceros_mov') continue;
    try{
      if(it.saldoC===0&&!it.legacy&&!it.flag) await db.collection(it.col).doc(it.id).update({[it.field]:true,[it.autoField]:true});
      else if(it.saldoC>0&&it.flag&&it.auto) await db.collection(it.col).doc(it.id).update({[it.field]:false,[it.autoField]:false});
    }catch(e){ console.error('terceros: sincronizar',it.key,e); } } }
async function dtCrearConcepto(d){
  const persona=String(d.persona||'').trim(), monto=toNum(d.monto), desc=String(d.desc||'').trim().slice(0,80), fechaISO=d.fechaISO||dtHoy();
  if(!persona) throw new Error('Falta la persona.'); if(!(monto>0)) throw new Error('El importe tiene que ser mayor a 0.'); if(!desc) throw new Error('Falta la descripción.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)) throw new Error('Fecha inválida.');
  const id=dtNuevoId('tc');
  await db.doc('terceros_mov/'+id).set({kind:'concepto',persona,desc,monto,fechaISO,fecha:dtCorta(fechaISO),obs:String(d.obs||'').trim().slice(0,120),creadoISO:ahoraNS().toISOString()});
  return {id,persona,monto,desc}; }
async function dtCrearCobro(d){
  const persona=String(d.persona||'').trim(), monto=toNum(d.monto), fechaISO=d.fechaISO||dtHoy(), medio=d.medio==='efectivo'?'efectivo':'digital';
  const g=dtCalc()[persona]; if(!g||g.pendienteC<=0) throw new Error('Esa persona no tiene deuda pendiente.');
  if(!(monto>0)) throw new Error('El importe tiene que ser mayor a 0.');
  if(dtC(monto)>g.pendienteC) throw new Error(`El cobro no puede superar la deuda pendiente (${'$'+fmt(g.pendiente)}).`);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)) throw new Error('Fecha inválida.'); if(fechaISO>dtHoy()) throw new Error('La fecha no puede ser futura.');
  const tipo=medio==='efectivo'?'fisico':'digital', Z=window.__vz;
  let cuentaId=d.cuentaId;
  if(!cuentaId||cuentaId==='__auto'){ if(!Z||!Z.vzAncla||!Z.vzAsegurar) throw new Error('No encontré una cuenta de destino en Billetera.'); cuentaId=await Z.vzAsegurar(Z.vzAncla(tipo),tipo); }
  const cu=window.__wl.state.cuentas.find(c=>c.id===cuentaId); if(cu&&cu.tipo!==tipo) throw new Error('La cuenta elegida no corresponde al medio de cobro.');
  const id=dtNuevoId('tp'), wid='wm_'+id, ahora=ahoraNS().toISOString();
  const pago={kind:'pago',persona,monto,fechaISO,fecha:dtCorta(fechaISO),medio,cuentaId,walletMovId:wid,creadoISO:ahora};
  await db.doc('terceros_mov/'+id).set(pago);
  try{ await db.doc('wallet_movs/'+wid).set({tipo:'ingreso',monto,fechaISO,fecha:window.__wl.wlCorta(fechaISO),cuentaId,desc:'Cobro a '+persona,catId:'ingreso',terceroCobro:persona,terceroPagoId:id,creadoISO:ahora}); }
  catch(e){ try{ await db.doc('terceros_mov/'+id).delete(); }catch(_){ } throw e; }
  await dtSincronizar(persona,{agregar:[{id,...pago}]});
  const nuevo=dtCalc({agregar:[{id,...pago}]})[persona];
  return {id,persona,monto,pendiente:nuevo?nuevo.pendiente:0,aplic:(nuevo&&nuevo.pagos.find(p=>p.id===id)||{aplic:[]}).aplic}; }
async function dtBorrarPago(id){
  const p=tercerosMov.find(x=>x.id===id&&x.kind==='pago'); if(!p) return;
  if(!confirm(`¿Eliminar el cobro de $${fmt(p.monto)} a ${p.persona}? También se quita el ingreso en Billetera y la deuda vuelve a subir.`)) return;
  try{ if(p.walletMovId){ try{ await db.doc('wallet_movs/'+p.walletMovId).delete(); }catch(e){ console.error(e); throw e; } }
    await db.doc('terceros_mov/'+id).delete(); await dtSincronizar(p.persona,{quitar:[id]}); }
  catch(e){ console.error(e); alert('No se pudo eliminar. Probá de nuevo.'); } }
async function dtBorrarConcepto(id){
  const c=tercerosMov.find(x=>x.id===id&&x.kind==='concepto'); if(!c) return;
  if(!confirm(`¿Eliminar «${c.desc}» ($${fmt(c.monto)}) de ${c.persona}? Los cobros ya registrados se reimputan a las demás deudas.`)) return;
  try{ await db.doc('terceros_mov/'+id).delete(); await dtSincronizar(c.persona,{quitar:[id]}); }catch(e){ console.error(e); alert('No se pudo eliminar. Probá de nuevo.'); } }
async function dtMarcarDevuelto(col,id,val){ try{ await db.collection(col).doc(id).update({[col==='movimientos'?'terceroCobrado':'cobrado']:val,[col==='movimientos'?'terceroCobradoAuto':'cobradoAuto']:false}); }catch(e){ console.error(e); alert('No se pudo actualizar. Probá de nuevo.'); } }

/* ---------- WhatsApp ---------- */
function dtMensaje(g){ const pend=g.items.filter(i=>i.saldoC>0).sort((a,b)=>String(a.iso).localeCompare(String(b.iso)));
  const lineas=pend.map(it=>`• ${dtCorta(it.iso)} – $${fmt(it.saldo)} (${it.obs||it.motivo})${it.pagadoC>0?` · saldo de $${fmt(it.monto)}`:''}`).join('\n');
  return `¡Hola, ${g.nombre}!\n\nTe comparto el detalle de tu saldo pendiente:\n\n${lineas}\n\nTOTAL A PAGAR: $${fmt(g.pendiente)}\n\nPodés realizar la transferencia a los siguientes datos:\n\nAlias: ${tercerosCfg.alias}\nBanco: ${tercerosCfg.banco}\n\nMuchas gracias.\n\nMensaje automático de NicSys.`; }
function dtWhatsApp(nombre){ const g=dtCalc()[nombre]; if(!g||g.pendienteC<=0){ alert('Esta persona no tiene deuda pendiente.'); return; }
  if(!tercerosCfg.alias||!tercerosCfg.banco){ alert('Primero cargá el alias y el banco en Panel Maestro > Deudas de terceros.'); openMasterPanel(); return; }
  window.open(`https://wa.me/${normalizarTelWA(tercerosCfg.tels[nombre])}?text=${encodeURIComponent(dtMensaje(g))}`,'_blank','noopener'); }

/* ---------- vista principal (dentro de Finanzas) ---------- */
const DT_ICO={
 up:'<path d="M7 17 17 7M9 7h8v8"/>', down:'<path d="M17 7 7 17M7 9v8h8"/>', back:'<path d="m15 5-7 7 7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="m6 6 12 12M18 6 6 18"/>',
 wa:'<path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .8c-.8-.4-1.6-1.2-2-2l.8-1-1-2L9 9Z"/>',
 user:'<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.7-5.4 7-5.4s6.2 1.8 7 5.4"/>', trash:'<path d="M5 7h14M10 7V4.5h4V7m-7 0 .8 12.5h8.4L17 7M10 11v5m4-5v5"/>',
 cash:'<rect x="3" y="6.5" width="18" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/>', bank:'<path d="M3 9.5 12 4l9 5.5M5 10v8m4-8v8m6-8v8m4-8v8M3 20h18"/>', check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>', card:'<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/>', tag:'<path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.2"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>' };
const dtIc=(k,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DT_ICO[k]||''}</svg>`;
const dtAvatar=(n,s)=>`<span class="dt-av" style="--c:${dtColor(n)};${s?`width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px`:''}">${dtEsc(dtIni(n))}</span>`;
function dtRing(pct,size,col){ const r=15.9155, p=Math.max(0,Math.min(100,pct)); return `<svg class="dt-ring" width="${size}" height="${size}" viewBox="0 0 36 36" role="img" aria-label="${p}% cobrado"><circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(230,254,255,.14)" stroke-width="3.4"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${col||'#12b981'}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${p} ${100-p}" transform="rotate(-90 18 18)"/><text x="18" y="18.4" text-anchor="middle" dominant-baseline="central" font-size="8.6" font-weight="800" fill="#F4FEFF">${p}%</text></svg>`; }
function dtFilaEvento(e,g,conNombre,run){ const cobro=e.t==='cobro', col=cobro?'#12b981':'#ef4444';
  return `<div class="dt-row md-tap" data-md="${cobro?'dtp:'+dtEsc(e.pago.id):'dti:'+dtEsc(e.item.key)}" role="button" tabindex="0"><span class="dt-ic" style="--c:${col}">${dtIc(cobro?(e.pago.medio==='efectivo'?'cash':'bank'):(e.item.tipo==='tarjeta'?'card':e.item.tipo==='efectivo'?'cash':'tag'),20)}</span>
    <div class="dt-rt"><b>${dtEsc(e.titulo)}${cobro?` · ${dtEsc(g.nombre)}`:''}</b><small>${conNombre&&!cobro?dtEsc(g.nombre)+' · ':''}${dtCorta(e.iso)}${e.sub?' · '+dtEsc(e.sub):''}</small></div>
    <span class="dt-amt ${cobro?'pos':'neg'}">${dtMs(dtP(e.c),cobro?'+':'-')}${run!==undefined?`<small class="dt-run">Saldo ${dtM(dtP(run))}</small>`:''}</span></div>`; }
function dtCuerpo(lista){
  const q=dt.busq, vis=lista.filter(g=>dtPersonaCoincide(q,g)); dt.nombres=vis.map(g=>g.nombre);
  const cards=vis.map((g,i)=>`<button type="button" class="dt-card${g.pendienteC<=0?' paid':''}" onclick="dtAbrirIdx(${i})" aria-label="Abrir ${dtEsc(g.nombre)}">
      <span class="dt-card-top">${dtAvatar(g.nombre,34)}<span class="dt-chev">${dtIc('up',14)}</span></span><b class="dt-card-n">${dtEsc(g.nombre)}</b>
      <span class="dt-card-v">${dtM(g.pendiente)}</span><span class="dt-chip ${g.pct>=100?'ok':g.pct>0?'mid':''}">${g.pendienteC<=0?'Saldado':g.pct+'% cobrado'}${g.pct>0&&g.pendienteC>0?' ▲':''}</span></button>`).join('');
  const evs=[]; vis.forEach(g=>g.eventos.forEach(e=>{ if(!q.trim()||bqCoincide(q,[g.nombre])||dtEvCoincide(q,g,e)) evs.push({e,g}); }));
  evs.sort((a,b)=>(String(b.e.iso)+b.e.creado).localeCompare(String(a.e.iso)+a.e.creado));
  const lim=dt.verTodo||q.trim()?60:6, rows=evs.slice(0,lim).map(x=>dtFilaEvento(x.e,x.g,true)).join('');
  if(!lista.length) return `<div class="dt-empty big">Todavía no hay deudas de terceros.<br><small>Cargá una con «Nueva deuda» o marcá un consumo de tarjeta como de otra persona.</small></div>`;
  return `<div class="dt-sec"><b>Deudores</b><span>${vis.length} de ${lista.length}</span></div>
      <div class="dt-hs" role="list">${cards||'<div class="dt-empty">Sin resultados.</div>'}</div>
      <div class="dt-sec"><b>Actividad</b>${evs.length>6&&!q.trim()?`<button type="button" class="dt-link" onclick="dt.verTodo=!dt.verTodo;dtRender()">${dt.verTodo?'Ver menos':'Ver todo'}</button>`:(q.trim()?`<span>${evs.length} ${evs.length===1?'resultado':'resultados'}</span>`:'')}</div>${rows||'<div class="dt-empty">Sin movimientos.</div>'}`; }
function dtRender(){
  const root=document.getElementById('dtRoot'); if(!root) return;
  const foco=document.activeElement&&document.activeElement.id==='dtBusq', pos=foco?document.activeElement.selectionStart:0;
  const lista=dtLista(), totalPend=lista.reduce((a,g)=>a+g.pendienteC,0), conDeuda=lista.filter(g=>g.pendienteC>0).length;
  root.innerHTML=`<section class="dt" aria-label="Deudas de terceros">
    <div class="dt-hero"><div class="dt-hi"><div><b>Deudas de terceros</b><small>No se resta de tu haber</small></div><span class="dt-badge">${conDeuda} ${conDeuda===1?'persona':'personas'}</span></div>
      <div class="dt-lbl">Total por cobrar</div>

function dtModal(html){ let m=document.getElementById('dtModal'); if(!m){ m=document.createElement('div'); m.id='dtModal'; m.className='dt-modal'; document.body.appendChild(m); }

  box.innerHTML=`<div class="dt-prev-t">Así se imputa</div>`+p.aplic.map(a=>{ const it=C.items.find(i=>i.key===a.key); return `<div class="dt-prev-r"><span>${dtEsc(a.motivo)}</span><b>${a.cancela?'Cancelada':'Queda '+dtM(it.saldo)}</b></div>`; }).join('')+`<div class="dt-prev-r tot"><span>Deuda restante</span><b>${dtM(C.pendiente)}</b></div>`; }
async function dtGuardarCobro(){ if(dt.busy) return; const e=document.getElementById('dtp_e'), ok=document.getElementById('dtp_ok');

  finally{ dt.busy=false; } }

let wlGid=0;
function wlIcon(k,sz,c1,c2){ sz=sz||20; const id='wg'+(++wlGid), g=!!c1;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${g?`url(#${id})`:'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${g?`<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2||c1}"/></linearGradient></defs>`:''}${WL_ICONS[k]||WL_ICONS.dots}</svg>`; }
function wlNum(v){ let t=String(v==null?'':v).replace(/[\s$]/g,''); if(!t) return NaN; if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t=t.replace(/\./g,'').replace(',','.'); else t=t.replace(',','.'); const n=Number(t); return isFinite(n)?n:NaN; }
const wlR2=n=>Math.round((n+Number.EPSILON)*100)/100;
function wlISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function wlHoy(){ return wlISO(ahoraNS()); }
function wlAdd(iso,n){ const p=iso.split('-').map(Number); return wlISO(new Date(p[0],p[1]-1,p[2]+n)); }
function wlCorta(iso){ const p=String(iso||'').split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:'—'; }
function wlDias(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000); }
function wlM(v,dec){ dec=2; const neg=v<0, s=(neg?'-':'')+'$'+new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(Math.abs(v||0)); return hideAmounts?`<span class="blurred">${s}</span>`:s; }
function wlPct(v){ return new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1}).format(v)+'%'; }

function wlShade(h,f){ const n=parseInt(h.slice(1),16), r=Math.round((n>>16)*(1-f)), g=Math.round(((n>>8)&255)*(1-f)), b=Math.round((n&255)*(1-f)); return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

/* ---------- saldos e intereses ---------- */
function wlEfecto(m,id){ const x=Number(m.monto)||0;
  if(m.tipo==='ingreso'||m.tipo==='interes'||m.tipo==='ajuste') return m.cuentaId===id?x:0;
  if(m.tipo==='gasto'||m.tipo==='pago_tarjeta') return m.cuentaId===id?-x:0;
  if(m.tipo==='transferencia') return (m.cuentaId===id?-x:0)+(m.destinoId===id?x:0);
  return 0; }
function wlSaldo(c,hasta){ if(hasta&&c.fechaApertura&&hasta<c.fechaApertura) return 0; let s=Number(c.saldoInicial)||0;
  for(const m of wl.movs){ if(hasta&&m.fechaISO>hasta) continue; s+=wlEfecto(m,c.id); } return wlR2(s); }
function wlPatrimonio(hasta){ let d=0,f=0; wl.cuentas.forEach(c=>{ const s=wlSaldo(c,hasta); if(c.tipo==='fisico') f+=s; else d+=s; }); return {d:wlR2(d),f:wlR2(f),t:wlR2(d+f)}; }
function wlInteresDia(c,open){ const tna=Number(c.tna)||0;
  if(c.tipo!=='digital'||!(tna>0)||c.remunera===false||!(open>0)) return 0;
  if(open<(Number(c.minimo)||0)) return 0;
  const tope=Number(c.tope)||0, base=tope>0?Math.min(open,tope):open, ex=tope>0?Math.max(0,open-tope):0;
  return wlR2((base*tna+ex*(Number(c.tnaExceso)||0))/100/365); }
function wlEdadTNA(c){ return c.tnaFecha?wlDias(c.tnaFecha,wlHoy()):null; }

async function walletAcreditarIntereses(){
  if(wlAcredBusy||!wl.ok.c||!wl.ok.m) return;
  const hoy=wlHoy(); if(wlAcredDia===hoy) return;
  wlAcredBusy=true; let fallo=false;
  try{
    for(const c of wl.cuentas.slice()){
      if(c.tipo!=='digital') continue;
      try{
        let p=c.ultimoInteres||c.fechaApertura||hoy;
        if(wlDias(p,hoy)<=0){ if(!c.ultimoInteres) await db.collection('wallet_cuentas').doc(c.id).update({ultimoInteres:p}); continue; }
        if(wlDias(p,hoy)>400) p=wlAdd(hoy,-400);
        let bal=wlSaldo(c,p);
        for(let d=wlAdd(p,1); d<=hoy; d=wlAdd(d,1)){
          const open=bal, clave=`int_${c.id}_${d.replace(/-/g,'')}`;
          const previo=wl.movs.some(m=>m.tipo==='interes'&&m.cuentaId===c.id&&m.fechaISO===d);
          let creado=0;
          if(!previo){
            const i=wlInteresDia(c,open);
            if(i>=0.01){
              const ref=db.doc('wallet_movs/'+clave);
              if(!(await ref.get()).exists){
                await ref.set({tipo:'interes',auto:true,clave,monto:i,fechaISO:d,fecha:wlCorta(d),cuentaId:c.id,catId:'rendimiento',
                  desc:'Rendimiento diario',tna:Number(c.tna),baseSaldo:open,creadoISO:ahoraNS().toISOString()});
                creado=i;
              }
            }
          }
          let neto=0; wl.movs.forEach(m=>{ if(m.fechaISO===d&&!(creado&&m.id===clave)) neto+=wlEfecto(m,c.id); });
          bal=wlR2(open+neto+creado);
        }
        await db.collection('wallet_cuentas').doc(c.id).update({ultimoInteres:hoy});
      }catch(e){ fallo=true; console.error('billetera: intereses',c.id,e); }
    }
    if(!fallo) wlAcredDia=hoy;
  }finally{ wlAcredBusy=false; }
}

function wlRecomendar(){
  const dig=wl.cuentas.filter(c=>c.tipo==='digital');
  const rem=dig.filter(c=>c.remunera!==false&&Number(c.tna)>0).sort((a,b)=>Number(b.tna)-Number(a.tna));
  if(!rem.length) return null;
  const sal={}; dig.forEach(c=>sal[c.id]=Math.max(0,wlSaldo(c)));
  const total=dig.reduce((a,c)=>a+sal[c.id],0);
  const meta={}; dig.forEach(c=>meta[c.id]=0);
  let resto=total;
  for(const c of rem){ const cap=Number(c.tope)>0?Number(c.tope):Infinity; const x=Math.min(resto,cap); meta[c.id]=x; resto-=x; if(resto<=0) break; }
  if(resto>0) meta[rem[0].id]+=resto;
  const actual=dig.reduce((a,c)=>a+wlInteresDia(c,sal[c.id]),0), optimo=dig.reduce((a,c)=>a+wlInteresDia(c,meta[c.id]),0);
  const don=[],rec=[];
  dig.forEach(c=>{ const d=sal[c.id]-meta[c.id]; if(d>=1000) don.push({c,m:d}); else if(d<=-1000) rec.push({c,m:-d}); });
  const mov=[]; don.sort((a,b)=>b.m-a.m); rec.sort((a,b)=>b.m-a.m);
  for(const r of rec){ for(const d of don){ if(r.m<=0) break; if(d.m<=0) continue; const x=Math.min(r.m,d.m); mov.push({de:d.c,a:r.c,monto:wlR2(x)}); r.m-=x; d.m-=x; } }
  return {mejor:rem[0],mov:mov.slice(0,3),actualDia:wlR2(actual),optimoDia:wlR2(optimo),gananciaDia:wlR2(optimo-actual),total};
}

/* ---------- períodos ---------- */
const WL_MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function wlRango(off){ const h=ahoraNS(), t=wlPer.t, o=(off==null?wlPer.off:off); let a,b,l;
  if(t==='dia'){ const d=new Date(h.getFullYear(),h.getMonth(),h.getDate()+o); a=b=wlISO(d); l=o===0?'Hoy':wlCorta(a); }
  else if(t==='semana'){ const dow=(h.getDay()+6)%7, s=new Date(h.getFullYear(),h.getMonth(),h.getDate()-dow+7*o), e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6); a=wlISO(s); b=wlISO(e); l=`${wlCorta(a).slice(0,5)} al ${wlCorta(b).slice(0,5)}`; }
  else if(t==='mes'){ const s=new Date(h.getFullYear(),h.getMonth()+o,1), e=new Date(s.getFullYear(),s.getMonth()+1,0); a=wlISO(s); b=wlISO(e); l=WL_MESES[s.getMonth()].replace(/^./,x=>x.toUpperCase())+' '+s.getFullYear(); }
  else { const y=h.getFullYear()+o; a=y+'-01-01'; b=y+'-12-31'; l=String(y); }
  return {a,b,l}; }
function wlAgg(a,b){ const g={}; let ing=0,gas=0,rend=0;
  wl.movs.forEach(m=>{ if(m.fechaISO<a||m.fechaISO>b) return; const x=Number(m.monto)||0;
    if(m.tipo==='gasto'){ gas+=x; const k=m.catId||'otros'; g[k]=(g[k]||0)+x; } else if(m.tipo==='ingreso') ing+=x; else if(m.tipo==='interes') rend+=x; });
  return {ing:wlR2(ing),gas:wlR2(gas),rend:wlR2(rend),g}; }
function wlSerie(){ const h=ahoraNS(), hoy=wlHoy(), t=wlPer.t, o=wlPer.off, out=[];
  if(t==='dia'){ for(let i=6;i>=0;i--){ const d=wlISO(new Date(h.getFullYear(),h.getMonth(),h.getDate()+o-i)); out.push({l:wlCorta(d).slice(0,5),a:d,b:d}); } }
  else if(t==='semana'){ for(let i=7;i>=0;i--){ const r=wlRango(o-i); out.push({l:r.a.slice(8)+'/'+r.a.slice(5,7),a:r.a,b:r.b}); } }
  else if(t==='mes'){ for(let i=5;i>=0;i--){ const r=wlRango(o-i); out.push({l:r.l.slice(0,3),a:r.a,b:r.b}); } }
  else { const y=h.getFullYear()+o; for(let m=0;m<12;m++){ const s=new Date(y,m,1), e=new Date(y,m+1,0); out.push({l:WL_MESES[m].slice(0,3),a:wlISO(s),b:wlISO(e)}); } }
  return out.filter(p=>p.a<=hoy).map(p=>({l:p.l,v:wlPatrimonio(p.b>hoy?hoy:p.b).t,r:wlAgg(p.a,p.b).rend})); }

/* ---------- gráficos ---------- */
function wlDonut(items,total,centro){ if(!(total>0)) return `<div class="wl-donut empty"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(230,254,255,.12)" stroke-width="4.2"/></svg><div class="wl-dc"><small>Sin gastos</small></div></div>`;
  let cum=0, segs='';
  items.forEach(it=>{ const p=it.v/total*100, len=Math.max(p-0.9,0.3); segs+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${it.c}" stroke-width="4.4" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(25-cum).toFixed(2)}" stroke-linecap="round" style="filter:drop-shadow(0 0 1.2px ${it.c})"/>`; cum+=p; });
  return `<div class="wl-donut"><svg viewBox="0 0 42 42" role="img" aria-label="Gastos por categoría"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(230,254,255,.08)" stroke-width="4.4"/>${segs}</svg><div class="wl-dc"><small>Gastos</small><b>${centro}</b></div></div>`; }
function wlAbrev(v){ const a=Math.abs(v); if(a>=1e6) return (v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M'; if(a>=1e3) return Math.round(v/1e3)+'K'; return String(Math.round(v)); }
function wlTxt(v){ return hideAmounts?'$•••':(v<0?'-':'')+'$'+new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(v)); }
function wlSmooth(p,lo,hi){ const cl=y=>Math.min(Math.max(y,lo),hi); let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){ const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2, t=.17;
    d+=` C${(p1[0]+(p2[0]-p0[0])*t).toFixed(1)},${cl(p1[1]+(p2[1]-p0[1])*t).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])*t).toFixed(1)},${cl(p2[1]-(p3[1]-p1[1])*t).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; } return d; }
function wlArea(serie,sel){ if(serie.length<2) return `<div class="wl-empty">Todavía no hay suficiente historial.</div>`;
  const W=330,H=150,L=40,R=12,T=36,B=22, vals=serie.map(x=>x.v); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx===mn) mx=mn+1; const pad=(mx-mn)*.14, neg=Math.min(...vals)<0; mn=neg?mn-pad:Math.max(0,mn-pad); mx+=pad;
  const X=i=>L+i*(W-L-R)/(serie.length-1), Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B), pts=serie.map((x,i)=>[X(i),Y(x.v)]);
  let grid=''; for(let k=0;k<4;k++){ const v=mn+(mx-mn)*k/3, y=Y(v); grid+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(230,254,255,.1)" stroke-dasharray="3 4"/><text x="${L-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#BCD8DB">${hideAmounts?'•••':wlAbrev(v)}</text>`; }
  const line=wlSmooth(pts,T,H-B), area=`${line} L${X(serie.length-1).toFixed(1)},${H-B} L${L},${H-B} Z`;
  const si=Math.min(Math.max(sel,0),serie.length-1), sx=pts[si][0], sy=pts[si][1], tw=104, tx=Math.min(Math.max(sx-tw/2,L-6),W-R-tw+6), ty=Math.max(sy-46,2);
  const tip=`<line x1="${sx.toFixed(1)}" x2="${sx.toFixed(1)}" y1="${(ty+36).toFixed(1)}" y2="${H-B}" stroke="rgba(55,244,181,.5)" stroke-dasharray="3 3"/><rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw}" height="36" rx="10" fill="#021F21" stroke="rgba(55,244,181,.55)"/><text x="${(tx+tw/2).toFixed(1)}" y="${(ty+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="#BCD8DB">${wlEsc(serie[si].l)}</text><text x="${(tx+tw/2).toFixed(1)}" y="${(ty+28).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${wlTxt(serie[si].v)}</text><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5" fill="#021F21" stroke="#37F4B5" stroke-width="2.4"/>`;
  const lab=serie.map((x,i)=>(serie.length<=8||i%2===0||i===serie.length-1)?`<text x="${pts[i][0].toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#BCD8DB">${wlEsc(x.l)}</text>`:'').join('');
  const hit=pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="14" fill="transparent" style="cursor:pointer" onclick="wlSelPt(${i})"/>`).join('');
  const maxR=Math.max(...serie.map(x=>x.r),0), bars=maxR>0?serie.map((x,i)=>{ const h=Math.max(2,x.r/maxR*20); return `<rect x="${(X(i)-4).toFixed(1)}" y="${(H+30-h).toFixed(1)}" width="8" height="${h.toFixed(1)}" rx="3" fill="#a78bfa" opacity=".75"/>`; }).join('')+`<text x="${L-6}" y="${H+26}" text-anchor="end" font-size="8" fill="#BCD8DB">Rend.</text>`:'';
  return `<svg class="wl-line" viewBox="0 0 ${W} ${H+(maxR>0?36:10)}" role="img" aria-label="Evolución del patrimonio"><defs><linearGradient id="wlga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#37F4B5" stop-opacity=".34"/><stop offset="1" stop-color="#37F4B5" stop-opacity="0"/></linearGradient><linearGradient id="wlgl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#37F4B5"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#wlga)"/><path d="${line}" fill="none" stroke="url(#wlgl)" stroke-width="2.6" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(55,244,181,.5))"/>${lab}${bars}${tip}${hit}</svg>`; }

function wlPickCat(b){ wlSelCat=b.dataset.id; document.querySelectorAll('.wl-cat[data-id]').forEach(x=>x.classList.toggle('on',x===b)); }
async function wlGuardarMov(tipo){
  if(wlBusy) return;
  const monto=wlR2(wlNum(document.getElementById('wm_monto').value)), fechaISO=document.getElementById('wm_fecha').value, cuentaId=document.getElementById('wm_cuenta').value;
  const destinoId=tipo==='transferencia'?document.getElementById('wm_dest').value:'', desc=document.getElementById('wm_desc').value.trim().slice(0,80);
  if(!(monto>0)){ alert('Ingresá un importe mayor a 0.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)){ alert('Elegí una fecha válida.'); return; }
  if(fechaISO>wlHoy()){ alert('La fecha no puede ser futura.'); return; }
  const c=wl.cuentas.find(x=>x.id===cuentaId); if(!c){ alert('Elegí una cuenta.'); return; }
  if(tipo==='transferencia'){ if(!destinoId||destinoId===cuentaId){ alert('El origen y el destino tienen que ser cuentas distintas.'); return; } }
  if((tipo==='gasto'||tipo==='transferencia')&&wlSaldo(c)-monto<0&&!confirm(`Esta operación deja ${c.nombre} en saldo negativo. ¿Registrarla igual?`)) return;
  const firma=[tipo,monto,fechaISO,cuentaId,destinoId,desc].join('|'), ahora=Date.now();
  if(firma===wlFirma&&ahora-wlFirmaT<15000){ closeModal(); return; }
  wlBusy=true; const btn=document.getElementById('wm_ok'); if(btn) btn.disabled=true;
  try{
    const doc={tipo,monto,fechaISO,fecha:wlCorta(fechaISO),cuentaId,desc,creadoISO:ahoraNS().toISOString()};
    if(tipo==='gasto') doc.catId=wlSelCat; if(tipo==='ingreso') doc.catId='ingreso'; if(tipo==='transferencia') doc.destinoId=destinoId;
    await db.collection('wallet_movs').add(doc); wlFirma=firma; wlFirmaT=ahora; closeModal();
  }catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); if(btn) btn.disabled=false; }
  finally{ wlBusy=false; }
}

  const cu=wl.cuentas.slice().sort((a,b)=>(a.orden||0)-(b.orden||0)), opts=sel=>cu.map(c=>`<option value="${wlEsc(c.id)}" ${c.id===sel?'selected':''}>${wlEsc(c.nombre)} · ${c.tipo==='digital'?'Dinero digital':'Efectivo'}</option>`).join('');

  const t=m.tipo, tit={gasto:'Editar gasto',ingreso:'Editar ingreso',transferencia:'Editar transferencia',pago_tarjeta:'Editar pago de tarjeta'}[t]||'Editar movimiento';
  wlModal(`<h3>${tit}</h3>
   <div class="field"><label for="we_monto">Importe</label><input id="we_monto" inputmode="decimal" value="${String(wlR2(Math.abs(Number(m.monto)||0))).replace('.',',')}" autocomplete="off"></div>

   ${t==='transferencia'?`<div class="field"><label for="we_dest">Cuenta de destino</label><select id="we_dest">${opts(m.destinoId)}</select></div>`:''}

   <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="we_ok" onclick="wlGuardarEdicion('${wlEsc(id)}')">Guardar</button></div>`); }
async function wlGuardarEdicion(id){ if(wlBusy) return; const m=wl.movs.find(x=>x.id===id); if(!m) return; const g=i=>document.getElementById(i);
  const monto=wlR2(wlNum(g('we_monto').value)), fechaISO=g('we_fecha').value, cuentaId=g('we_cuenta').value, desc=g('we_desc').value.trim().slice(0,80), t=m.tipo, dest=g('we_dest')?g('we_dest').value:'';
  if(!(monto>0)){ alert('Ingresá un importe mayor a 0.'); return; } if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)){ alert('Elegí una fecha válida.'); return; } if(fechaISO>wlHoy()){ alert('La fecha no puede ser futura.'); return; }
  const c=wl.cuentas.find(x=>x.id===cuentaId); if(!c){ alert('Elegí una cuenta.'); return; } if(t==='transferencia'&&(!dest||dest===cuentaId)){ alert('El origen y el destino tienen que ser cuentas distintas.'); return; }
  if(t==='gasto'||t==='transferencia'||t==='pago_tarjeta'){ const base=wlSaldo(c)+(m.cuentaId===cuentaId?(Number(m.monto)||0):0); if(base-monto<0&&!confirm(`Esta operación deja ${c.nombre} en saldo negativo. ¿Guardarla igual?`)) return; }
  const upd={monto,fechaISO,fecha:wlCorta(fechaISO),cuentaId,desc,editadoISO:ahoraNS().toISOString()}; if(t==='gasto') upd.catId=g('we_cat').value; if(t==='transferencia') upd.destinoId=dest; if(g('we_com')){ const cm=g('we_com').value.trim().slice(0,60); if(cm||m.comercio!=null) upd.comercio=cm; }
  nsConfirmCambios(async()=>{ wlBusy=true; try{ await db.doc('wallet_movs/'+id).update(upd);
    if(t==='pago_tarjeta'&&m.tarjetaId){ try{ if(m.pagoTarjetaId) await db.collection('pagos_tarjeta').doc(m.pagoTarjetaId).update({monto,fecha:wlCorta(fechaISO)});
      const tj=(typeof tarjetas!=='undefined'?tarjetas:[]).find(x=>x.id===m.tarjetaId), dif=wlR2(monto-(Number(m.monto)||0)); if(tj&&dif!==0) await db.collection('tarjetas').doc(tj.id).update({usado:rd2(Math.max((Number(tj.usado)||0)-dif,0))}); }catch(e){ console.error(e); } }
    closeModal(); }catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); } finally{ wlBusy=false; } }); }
async function wlBorrarMov(id){ const m=wl.movs.find(x=>x.id===id); if(!m||m.tipo==='interes'||m.tipo==='ajuste') return;
  if(!confirm(m.tipo==='pago_tarjeta'?'¿Eliminar este pago? Se repone la deuda de la tarjeta y se recalcula el saldo.':'¿Eliminar este movimiento? El saldo se recalcula.')) return;
  try{ await db.doc('wallet_movs/'+id).delete();
    if(m.tipo==='pago_tarjeta'&&m.pagoTarjetaId&&m.tarjetaId){ try{ await db.collection('pagos_tarjeta').doc(m.pagoTarjetaId).delete();
      const t=(typeof tarjetas!=='undefined'?tarjetas:[]).find(x=>x.id===m.tarjetaId); if(t) await db.collection('tarjetas').doc(t.id).update({usado:rd2((Number(t.usado)||0)+(Number(m.monto)||0))}); }catch(e){ console.error(e); } }
  }catch(e){ console.error(e); alert('No se pudo eliminar.'); } }

async function wlGuardarCuenta(id){
  if(wlBusy) return; const nombre=document.getElementById('wc_n').value.trim();
  if(!nombre){ alert('Falta el nombre.'); return; }
  if(wl.cuentas.some(c=>c.id!==id&&c.nombre.toLowerCase()===nombre.toLowerCase())){ alert('Ya existe una cuenta con ese nombre.'); return; }
  const tipo=id?wl.cuentas.find(c=>c.id===id).tipo:document.getElementById('wc_t').value, dig=tipo==='digital';
  const num=(i,def)=>{ const e=document.getElementById(i); if(!e||!e.value.trim()) return def; return wlNum(e.value); };
  const tope=dig?num('wc_tope',0):0, ex=dig?num('wc_ex',0):0, min=dig?num('wc_min',0):0;
  if([tope,ex,min].some(v=>isNaN(v)||v<0)){ alert('Revisá los importes: tienen que ser números positivos.'); return; }
  const data={nombre,tipo,tope,tnaExceso:ex,minimo:min,remunera:dig?document.getElementById('wc_rem').checked:false,nota:document.getElementById('wc_nota').value.trim().slice(0,120)};
  wlBusy=true; const btn=document.getElementById('wc_ok'); if(btn) btn.disabled=true;
  try{
    if(id) await db.collection('wallet_cuentas').doc(id).update(data);
    else{ const s=wlNum(document.getElementById('wc_s').value); if(isNaN(s)){ alert('Revisá el saldo inicial.'); wlBusy=false; if(btn) btn.disabled=false; return; }
      const hoy=wlHoy(); await db.collection('wallet_cuentas').add({...data,saldoInicial:wlR2(s),fechaApertura:hoy,ultimoInteres:hoy,tna:0,tnaFecha:'',tnaFuente:'',orden:wl.cuentas.length+1,creadoISO:ahoraNS().toISOString()}); }
    closeModal();
  }catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); if(btn) btn.disabled=false; }
  finally{ wlBusy=false; }
}
async function wlBorrarCuenta(id){ if(wl.movs.some(m=>m.cuentaId===id||m.destinoId===id)){ alert('No se puede eliminar: la cuenta tiene movimientos.'); return; }
  if(!confirm('¿Eliminar esta cuenta?')) return;
  try{ await db.doc('wallet_cuentas/'+id).delete(); closeModal(); }catch(e){ console.error(e); alert('No se pudo eliminar.'); } }
async function wlCrearSugeridas(){ if(wlBusy) return; wlBusy=true;
  try{ const hoy=wlHoy(); let n=1;
    for(const s of WL_SUGERIDAS){ if(wl.cuentas.some(c=>c.id===s.id||c.nombre.toLowerCase()===s.nombre.toLowerCase())) continue;
      await db.doc('wallet_cuentas/'+s.id).set({nombre:s.nombre,tipo:s.tipo,tope:s.tope,tnaExceso:s.tnaExceso,minimo:0,remunera:s.tipo==='digital',nota:s.nota,saldoInicial:0,fechaApertura:hoy,ultimoInteres:hoy,tna:0,tnaFecha:'',tnaFuente:'',orden:n++,creadoISO:ahoraNS().toISOString()}); }
  }catch(e){ console.error(e); alert('No se pudieron crear las cuentas.'); }
  finally{ wlBusy=false; } }
function wlFormTNA(){ const cs=wl.cuentas.filter(c=>c.tipo==='digital'&&c.remunera!==false);
  if(!cs.length){ alert('No hay cuentas digitales que remuneren.'); return; }
  wlModal(`<h3>Actualizar TNA</h3><p class="wl-p">Copiá las TNA vigentes desde trascendo.com. Dejá vacía la cuenta que no remunera: no se calcula rendimiento sin dato.</p>
   <a class="btn" style="width:100%;margin-bottom:10px" href="https://trascendo.com/" target="_blank" rel="noopener">Abrir trascendo.com</a>
   <div class="field"><label for="wt_f">Fecha de la tasa</label><input id="wt_f" type="date" value="${wlHoy()}" max="${wlHoy()}"></div>
   ${cs.map(c=>`<div class="field"><label for="wt_${c.id}">${wlEsc(c.nombre)} (TNA %)</label><input id="wt_${c.id}" data-id="${c.id}" class="wt" inputmode="decimal" value="${Number(c.tna)>0?String(c.tna).replace('.',','):''}" placeholder="Ej: 21,5" autocomplete="off"></div>`).join('')}
   <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="wt_ok" onclick="wlGuardarTNA()">Guardar</button></div>`); }
async function wlGuardarTNA(){ if(wlBusy) return; const f=document.getElementById('wt_f').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(f)||f>wlHoy()){ alert('Elegí una fecha válida.'); return; }
  const cambios=[]; for(const e of document.querySelectorAll('.wt')){ const v=e.value.trim(); if(!v) continue; const n=wlNum(v); if(isNaN(n)||n<=0||n>300){ alert('Revisá la TNA de una cuenta: tiene que estar entre 0 y 300.'); return; } cambios.push([e.dataset.id,n]); }
  wlBusy=true; const btn=document.getElementById('wt_ok'); if(btn) btn.disabled=true;
  try{ for(const [id,n] of cambios){ const c=wl.cuentas.find(x=>x.id===id)||{}, upd={tna:n,tnaFecha:f,tnaFuente:'trascendo.com (carga manual)'};
      if(!(Number(c.tna)>0)){ let ini=wlAdd(f,-1); if(c.fechaApertura&&ini<c.fechaApertura) ini=c.fechaApertura; if(!c.ultimoInteres||ini<c.ultimoInteres) upd.ultimoInteres=ini; }
      await db.collection('wallet_cuentas').doc(id).update(upd); }
    closeModal(); wlAcredDia=''; walletAcreditarIntereses(); setTimeout(()=>{ wlAcredDia=''; walletAcreditarIntereses(); },900); }
  catch(e){ console.error(e); alert('No se pudo guardar. Probá de nuevo.'); if(btn) btn.disabled=false; }
  finally{ wlBusy=false; } }

  const rows=wl.cuentas.map(c=>`<div class="minirow" style="align-items:center;gap:8px"><span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis">${wlEsc(c.nombre)}</b><span class="hint">${c.tipo==='digital'?'Digital':'Efectivo'} · ${wlM(wlSaldo(c),2)}</span></span><button class="btn" type="button" onclick="wlFormSaldo('${c.id}')">Editar saldo</button></div>`).join('');
  return `<section class="master-card"><div class="master-card-head"><div class="master-card-name"><b>Saldos de cuentas</b><small>Cada cambio queda como «Ajuste de saldo» en movimientos</small></div></div>${rows}</section>`; }
function wlFormSaldo(id){ const c=wl.cuentas.find(x=>x.id===id); if(!c) return;
  wlModal(`<h3>Editar saldo</h3><p class="wl-p">${wlEsc(c.nombre)} · saldo actual ${wlM(wlSaldo(c),2)}</p>
   <div class="field"><label for="ws_n">Saldo real</label><input id="ws_n" inputmode="decimal" value="${String(wlSaldo(c)).replace('.',',')}" oninput="wlDifSaldo('${id}')" autocomplete="off"></div>
   <div class="wl-note" id="ws_dif">Sin cambios</div>
   <div class="modal-actions"><button class="btn" onclick="openMasterPanel()">Cancelar</button><button class="btn primary" id="ws_ok" onclick="wlGuardarSaldo('${id}')">Guardar</button></div>`); }
function wlDifSaldo(id){ const c=wl.cuentas.find(x=>x.id===id), el=document.getElementById('ws_dif'); if(!c||!el) return;
  const n=wlNum(document.getElementById('ws_n').value); if(isNaN(n)){ el.textContent='Importe no válido'; return; }
  const d=wlR2(n-wlSaldo(c)); el.textContent=d===0?'Sin cambios':`Se registrará un ajuste de ${d>0?'+':'-'}$${new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(d))}`; }
async function wlGuardarSaldo(id){
  if(wlBusy) return; const c=wl.cuentas.find(x=>x.id===id); if(!c) return;
  const nuevo=wlNum(document.getElementById('ws_n').value); if(isNaN(nuevo)){ alert('Revisá el importe del saldo.'); return; }
  const actual=wlSaldo(c), dif=wlR2(nuevo-actual); if(dif===0){ openMasterPanel(); return; }
  const ahora=ahoraNS(); if(wl.movs.some(m=>m.tipo==='ajuste'&&m.cuentaId===id&&Number(m.monto)===dif&&m.creadoISO&&ahora.getTime()-Date.parse(m.creadoISO)<10000)){ openMasterPanel(); return; }
  wlBusy=true; const btn=document.getElementById('ws_ok'); if(btn) btn.disabled=true;
  try{ const hoy=wlHoy(); await db.collection('wallet_movs').add({tipo:'ajuste',monto:dif,fechaISO:hoy,fecha:wlCorta(hoy),cuentaId:id,desc:'Ajuste de saldo',catId:'ajuste',saldoAnterior:actual,saldoNuevo:wlR2(nuevo),manual:true,creadoISO:ahora.toISOString()}); openMasterPanel(); }
  catch(e){ console.error(e); alert('No se pudo guardar el ajuste. Probá de nuevo.'); if(btn) btn.disabled=false; }
  finally{ wlBusy=false; } }

/* ---------- arranque ---------- */

function nsEditarItem(col,id){ const E=NS_ED[col]; if(!E) return; const it=E.L().find(x=>x.id===id); if(!it) return; const esc_=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h3>${E.t}</h3>${E.c.map(c=>`<div class="field"><label>${c[1]}</label><input id="ed_${c[0]}" ${c[2]==='n'?'inputmode="decimal"':''} value="${esc_(it[c[0]]==null?'':(c[2]==='n'?String(it[c[0]]).replace('.',','):it[c[0]]))}"></div>`).join('')}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick='nsGuardarItem(${JSON.stringify(col)},${JSON.stringify(id)})'>Guardar</button></div></div></div>`; }
async function nsGuardarItem(col,id){ const E=NS_ED[col], it=E.L().find(x=>x.id===id); if(!E||!it) return; const upd={}; for(const c of E.c){ const v=document.getElementById('ed_'+c[0]).value.trim(); if(c[2]==='n'){ const x=toNum(v); if(!(x>0)){ alert('Revisá los importes y cantidades: tienen que ser mayores a 0.'); return; } upd[c[0]]=x; } else { if(!v&&c[0]!=='obs'&&c[0]!=='aQuien'){ alert('Completá todos los campos.'); return; } upd[c[0]]=v; } }
  nsConfirmCambios(async()=>{ await db.collection(col).doc(id).update(upd); if((col==='prestamos_di'||col==='prestamos_recibi')&&it.walletMovId&&window.__wl){ const wm=window.__wl.state.movs.find(m=>m.id===it.walletMovId); if(wm){ const iso=upd.monto!=null?wm.fechaISO:wm.fechaISO; try{ await db.doc('wallet_movs/'+wm.id).update({monto:upd.monto,editadoISO:new Date().toISOString()}); }catch(e){ console.error(e); } } } closeModal(); }); }

<script id="v26-global">
(function(){ const nn=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); let busy=false, tries=0, revisado=false;
 async function dedup(){ const W=window.__wl; if(!W||!W.state||!W.state.ok||!W.state.ok.m||!W.state.ok.c) return false; const S=W.state; if(!S.cats.length) return true; const vistos={}; W.cats.forEach(c=>vistos[nn(c.n)]=c.id); const dup=[]; S.cats.forEach(c=>{ const k=nn(c.nombre); if(vistos[k]&&vistos[k]!==c.id) dup.push([c,vistos[k]]); else vistos[k]=c.id; });
  if(!dup.length) return true; S.alias=S.alias||{}; dup.forEach(([c,to])=>S.alias[c.id]=to);
  for(const [c,to] of dup){ try{ const ms=S.movs.filter(m=>m.catId===c.id); for(const m of ms) await db.doc('wallet_movs/'+m.id).update({catId:to,catMigradaDe:c.id}); await db.collection('wallet_cats').doc(c.id).delete(); window.dispatchEvent(new CustomEvent('wl-cat-migrada',{detail:{from:c.id,to}})); }catch(e){ console.error('dedup cat',e); } } return true; }
 const RX=/\b(pago|pague|abone|cancele|cancelacion)\b.*\b(tarjeta|resumen|visa|master ?card|mastercard|amex|cabal|naranja)\b|\bresumen\b.*\b(tarjeta|visa|master)/;
 async function revisar(){ const W=window.__wl; if(!W||!W.state.ok||!W.state.ok.m||revisado) return; revisado=true; const S=W.state;
  const seguros=S.movs.filter(m=>m.tipo==='pago_tarjeta'&&m.catId!=='tarjetas'); for(const m of seguros){ try{ await db.doc('wallet_movs/'+m.id).update({catId:'tarjetas'}); }catch(e){} }
  let key='ns_rev_pagos_v26'; try{ if(localStorage.getItem(key)) return; }catch(e){}
  const dudosos=S.movs.filter(m=>m.tipo==='gasto'&&m.catId!=='tarjetas'&&RX.test(nn((m.desc||'')+' '+(m.comercio||''))));
  if(!dudosos.length){ try{ localStorage.setItem(key,'1'); }catch(e){} return; }
  const d=document.createElement('div'); d.className='ns-conf'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML=`<div><b>Revisión de categorías</b><p style="margin:8px 0;color:#BCD8DB;font-size:14px">Encontré ${dudosos.length} gasto${dudosos.length>1?'s':''} que parece${dudosos.length>1?'n':''} pago${dudosos.length>1?'s':''} de resumen de tarjeta. ¿Los paso a la categoría Tarjetas? Solo cambia la categoría; importes y fechas no se tocan.</p><div class="row"><button type="button" class="btn" id="nsRvNo">Ahora no</button><button type="button" class="btn primary" id="nsRvSi">Pasar a Tarjetas</button></div></div>`; document.body.appendChild(d);
  d.querySelector('#nsRvNo').onclick=()=>{ d.remove(); try{ localStorage.setItem(key,'1'); }catch(e){} };
  d.querySelector('#nsRvSi').onclick=async()=>{ d.remove(); for(const m of dudosos){ try{ await db.doc('wallet_movs/'+m.id).update({catId:'tarjetas',catRevisada:true}); }catch(e){ console.error(e); } } try{ localStorage.setItem(key,'1'); }catch(e){} }; }
 const t=setInterval(async()=>{ tries++; try{ const ok=await dedup(); if(ok&&window.__wl&&window.__wl.state.ok&&window.__wl.state.ok.m){ await revisar(); } }catch(e){ console.error(e); } if(tries>40) clearInterval(t); },3000);
 window.addEventListener('wl-cat-migrada',()=>{ try{ if(window.render&&typeof activeTab!=='undefined'&&activeTab==='billetera') render(); }catch(e){} });
})();
</script>
